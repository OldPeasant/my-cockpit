# CI runs exactly what agents run (AGENTS.md, docs/ARCHITECTURE.md "Test"), with the same runtimes:
# JDK 21 (Gradle toolchain in server/build.gradle.kts, compileOptions in android/app/build.gradle.kts),
# Node from .nvmrc, Android SDK platform 37 + build-tools 36 (ARCHITECTURE.md "Install").
# Triggers: pushes to main and pull requests. Board-only and review-evidence commits (tasks/, reviews/,
# BOARD.md) don't start CI; wip/* backups and status/* branches are not built. Runs on main are never
# cancelled, so every finished task gets a complete result; other refs cancel superseded runs.
# Jobs run in parallel: the fast check split per part (check-tfp, check-server, check-web, check-android,
# each `sh scripts/check.sh <part>` with only the setup that part needs), integration tests, image build.
# When a test job fails, its Gradle test reports are uploaded as artifact test-reports-<job>.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "tasks/**"
      - "reviews/**"
      - "BOARD.md"
  pull_request:
    paths-ignore:
      - "tasks/**"
      - "reviews/**"
      - "BOARD.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  JAVA_VERSION: "21"

jobs:
  # The fast check, one job per part (sh scripts/check.sh <part>). Timeouts: server measured 14.5 min in
  # run 39625365916; web/android were not measured separately and are bounded by the remaining ~17.5 min
  # of the 32 min serial run, so their timeouts sit at ~2x that bound.
  check-tfp:
    name: Fast check (tfp gate tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: sh scripts/check.sh tfp
        run: sh scripts/check.sh tfp

  check-server:
    name: Fast check (server)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v5
      - name: sh scripts/check.sh server
        run: sh scripts/check.sh server
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-server
          path: |
            server/build/reports/tests/
            server/build/test-results/
          if-no-files-found: ignore

  check-web:
    name: Fast check (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: sh scripts/check.sh web
        run: sh scripts/check.sh web

  check-android:
    name: Fast check (android)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v5
      # Robolectric downloads one android-all-instrumented jar per SDK level at test time, outside Gradle, from
      # Maven Central, which rate-limits (HTTP 429) GitHub's shared runners. Cache them per Robolectric version,
      # without a cross-version fallback, so jars of an old version are never restored and saved again.
      # Restore and save are separate steps so the jars are saved even when the tests fail. The saved key ends in
      # a hash of the file list, so a new jar (new SDK level) is saved under a new key, an unchanged set is not.
      - name: Robolectric version
        id: robolectric
        run: echo "version=$(sed -n 's/^robolectric = "\(.*\)"$/\1/p' android/gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - name: Restore Robolectric runtime jars
        id: robolectric-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ steps.robolectric.outputs.version }}-
          restore-keys: |
            robolectric-${{ steps.robolectric.outputs.version }}-
      - name: sh scripts/check.sh android
        run: sh scripts/check.sh android
      - name: Robolectric cache key
        id: robolectric-key
        if: always()
        run: |
          dir=~/.m2/repository/org/robolectric
          if [ -n "$(find "$dir" -type f -name '*.jar' 2>/dev/null | head -n 1)" ]; then
            files=$(cd "$dir" && find . -type f -name '*.jar' | sort | sha256sum | cut -c1-16)
            echo "key=robolectric-${{ steps.robolectric.outputs.version }}-$files" >> "$GITHUB_OUTPUT"
          fi
      - name: Save Robolectric runtime jars
        if: >-
          always() && steps.robolectric-key.outputs.key != '' &&
          steps.robolectric-key.outputs.key != steps.robolectric-cache.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric-key.outputs.key }}
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-android
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: ignore

  integration:
    name: Server integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v5
      - name: ./gradlew integrationTest
        working-directory: server
        run: ./gradlew integrationTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-integration
          path: |
            server/build/reports/tests/
            server/build/test-results/
          if-no-files-found: ignore

  # The release APK the server offers at /download/android (SPEC.md §11). Signed with the keystore from the secrets
  # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD; without them
  # (forks, pull requests from forks) debug-signed. Artifact cockpit-android: cockpit.apk and output-metadata.json,
  # both copied to ${COCKPIT_DATA_DIR}/android/ on the server (deploy/README.md "Android app").
  android-apk:
    name: Android release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v5
      - name: Release keystore from secrets
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "COCKPIT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: ./gradlew assembleRelease
        working-directory: android
        env:
          COCKPIT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          COCKPIT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          COCKPIT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PcockpitVersionCode=${{ github.run_number }}
      - name: Collect APK
        run: |
          mkdir -p build/apk
          cp android/app/build/outputs/apk/release/app-release.apk build/apk/cockpit.apk
          cp android/app/build/outputs/apk/release/output-metadata.json build/apk/
      - uses: actions/upload-artifact@v7
        with:
          name: cockpit-android
          path: build/apk/
          if-no-files-found: error

  image:
    name: Docker image build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: docker build .
        run: docker build -t cockpit-server:ci .
