# CI runs exactly what agents run (AGENTS.md, docs/ARCHITECTURE.md "Test"), with the same runtimes:
# JDK 21 (Gradle toolchain in server/build.gradle.kts, compileOptions in android/app/build.gradle.kts),
# Node from .nvmrc, Android SDK platform 37 + build-tools 36 (ARCHITECTURE.md "Install").
# Triggers: pushes to main and pull requests. Board-only and review-evidence commits (tasks/, reviews/,
# BOARD.md) don't start CI; wip/* backups and status/* branches are not built. Runs on main are never
# cancelled, so every finished task gets a complete result; other refs cancel superseded runs.
# Jobs run in parallel: the fast check split per part (check-tfp, check-server, check-web, check-android,
# each `sh scripts/check.sh <part>` with only the setup that part needs), integration tests, image build.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "tasks/**"
      - "reviews/**"
      - "BOARD.md"
  pull_request:
    paths-ignore:
      - "tasks/**"
      - "reviews/**"
      - "BOARD.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  JAVA_VERSION: "21"

jobs:
  # The fast check, one job per part (sh scripts/check.sh <part>). Timeouts: server measured 14.5 min in
  # run 39625365916; web/android were not measured separately and are bounded by the remaining ~17.5 min
  # of the 32 min serial run, so their timeouts sit at ~2x that bound.
  check-tfp:
    name: Fast check (tfp gate tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: sh scripts/check.sh tfp
        run: sh scripts/check.sh tfp

  check-server:
    name: Fast check (server)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v5
      - name: sh scripts/check.sh server
        run: sh scripts/check.sh server

  check-web:
    name: Fast check (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: sh scripts/check.sh web
        run: sh scripts/check.sh web

  check-android:
    name: Fast check (android)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v5
      - name: sh scripts/check.sh android
        run: sh scripts/check.sh android

  integration:
    name: Server integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v5
      - name: ./gradlew integrationTest
        working-directory: server
        run: ./gradlew integrationTest

  image:
    name: Docker image build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: docker build .
        run: docker build -t cockpit-server:ci .
