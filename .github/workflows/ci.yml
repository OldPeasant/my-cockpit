# CI runs exactly what agents run (AGENTS.md, docs/ARCHITECTURE.md "Test"), with the same runtimes:
# JDK 21 (Gradle toolchain in server/build.gradle.kts, compileOptions in android/app/build.gradle.kts),
# Node from .nvmrc, Android SDK platform 37 + build-tools 36 (ARCHITECTURE.md "Install").
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

jobs:
  check:
    name: Fast check (scripts/check.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v5
      - name: Run scripts/check.sh
        run: sh scripts/check.sh

  integration:
    name: Server integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v5
      - name: ./gradlew integrationTest
        working-directory: server
        run: ./gradlew integrationTest

  image:
    name: Docker image build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: docker build .
        run: docker build -t cockpit-server:ci .
