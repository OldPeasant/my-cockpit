              schema:
                $ref: "#/components/schemas/OAuthConnectionResponse"
          description: "The connection, with its version as ETag"
          headers:
            ETag:
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such connection
      summary: One connection
      tags:
      - OAuth
  /api/v1/oauth/providers:
    get:
      operationId: listOAuthProviders
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OAuthProviderResponse"
          description: Both providers
      summary: The providers and whether their OAuth app is configured
      tags:
      - OAuth
  /api/v1/oauth/{provider}/callback:
    get:
      description: "Accepts only the state of a pending flow of the same browser session,\
        \ exchanges the code and stores the encrypted refresh token. Redirects to\
        \ `/settings/integrations` with `oauth=connected&provider=&purpose=&connectionId=`\
        \ or `oauth=error&provider=&error=` (`invalid_state`, `access_denied`, `token_exchange_failed`,\
        \ `no_refresh_token`) and, when known, `purpose=`."
      operationId: completeOAuthConnection
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
          enum:
          - google
          - microsoft
      - in: query
        name: code
        required: false
        schema:
          type: string
      - in: query
        name: state
        required: false
        schema:
          type: string
      - in: query
        name: error
        required: false
        schema:
          type: string
      responses:
        "302":
          description: Redirect to the SPA
          headers:
            Location:
              description: The SPA page showing the outcome
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unknown provider
      summary: The provider's redirect back (browser navigation)
      tags:
      - OAuth
  /api/v1/oauth/{provider}/start:
    get:
      description: "Redirects to the provider's consent screen (authorization code\
        \ flow with PKCE) asking for the combined calendar, mail and contacts scopes.\
        \ The flow is bound to the current browser session and expires after 10 minutes.\
        \ Connecting an account that is already connected updates that connection."
      operationId: startOAuthConnection
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
          enum:
          - google
          - microsoft
      - description: What the account is connected for; passed back to the SPA after
          the callback
        in: query
        name: purpose
        required: true
        schema:
          type: string
          enum:
          - CALENDAR
          - MAIL
          - CONTACTS
      responses:
        "302":
          content:
            '*/*':
              schema:
                type: object
          description: Redirect to the provider
          headers:
            Location:
              description: The provider's authorization URL
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or unknown purpose
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No browser session
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unknown provider
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The provider's OAuth app is not configured on this server
      summary: Start connecting a provider account (browser navigation)
      tags:
      - OAuth
  /api/v1/projects:
    get:
      description: "Projects matching every given filter, not in the Trash, ordered\
        \ by title, then id."
      operationId: listProjects
      parameters:
      - description: Only projects with this status
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - ON_HOLD
          - SOMEDAY
          - COMPLETED
          - DROPPED
      - description: Only projects in this area
        in: query
        name: areaId
        required: false
        schema:
          type: string
          format: uuid
      - description: "true: only stalled projects, false: only projects that are not\
          \ stalled"
        in: query
        name: stalled
        required: false
        schema:
          type: boolean
      - description: Cursor from the previous page
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: "Page size, 1-200 (default 50)"
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPageResponse"
          description: One page of projects
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
      summary: List projects
      tags:
      - Projects
    post:
      operationId: createProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
          description: Created
          headers:
            ETag:
              description: "Version of the project, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
      summary: Create a project
      tags:
      - Projects
  /api/v1/projects/{id}:
    delete:
      description: Its tasks keep their project.
      operationId: deleteProject
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the project
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "204":
          description: In the Trash
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found (projects: or in the Trash)"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Changed concurrently, or (contexts) the name is taken"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Move a project to the Trash
      tags:
      - Projects
    get:
      operationId: getProject
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
          description: The project with its (new) ETag
          headers:
            ETag:
              description: "Version of the project, for If-Match"
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found (projects: or in the Trash)"
      summary: One project
      tags:
      - Projects
    patch:
      description: Only the fields sent change; `null` clears a field. Unknown fields
        (including `nextTaskId`) are rejected.
      operationId: updateProject
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the project
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
          description: The project with its (new) ETag
          headers:
            ETag:
              description: "Version of the project, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found (projects: or in the Trash)"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Changed concurrently, or (contexts) the name is taken"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Change a project
      tags:
      - Projects
  /api/v1/projects/{id}/next-step:
    post:
      description: "The task must be an open task of the project (create a new one\
        \ with `POST /tasks` and `projectId` first); `taskId: null` clears the next\
        \ step. `taskId` must be sent; other fields are rejected. `If-Match` is optional."
      operationId: setProjectNextStep
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the project (optional)
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NextStepRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
          description: The project with its (new) ETag
          headers:
            ETag:
              description: "Version of the project, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found (projects: or in the Trash)"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Changed concurrently, or (contexts) the name is taken"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Designate the project's next step
      tags:
      - Projects
  /api/v1/projects/{id}/order:
    put:
      description: "The listed tasks come first, in the given order, then the project's\
        \ other tasks (open and done) in their previous order. Changes the tasks'\
        \ `position` (and version), not the project."
      operationId: orderProjectTasks
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderTasksRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
          description: All tasks of the project (not in the Trash) in the new order
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found (projects: or in the Trash)"
      summary: Order the project's tasks
      tags:
      - Projects
  /api/v1/reminders:
    get:
      description: "All reminders of the item, fired or not, earliest first."
      operationId: listReminders
      parameters:
      - description: Type of the item
        in: query
        name: itemType
        required: true
        schema:
          type: string
          enum:
          - TASK
          - PROJECT
          - NOTE
          - EVENT
          - EMAIL
          - FILE
          - FOLDER
          - CONTACT
          - BOOKMARK
          - JOURNAL_ENTRY
          - HABIT
      - description: Id of the item
        in: query
        name: itemId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListResponse"
          description: The item's reminders (empty when it has none or does not exist)
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid itemType or itemId
      summary: The reminders of an item
      tags:
      - Reminders
    post:
      description: "A time in the past is allowed: the reminder fires on the next\
        \ scheduler run (within seconds). An item that does not exist is rejected;\
        \ an item whose type has no module yet is accepted."
      operationId: createReminder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReminderRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResponse"
          description: Created; `Location` points to the reminder
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid request or unknown item
      summary: Add a reminder to an item
      tags:
      - Reminders
  /api/v1/reminders/upcoming:
    get:
      description: "Reminders that have not fired yet and are due at or before `until`,\
        \ overdue ones included, earliest first, at most 1000. The Android app schedules\
        \ local alarms from them."
      operationId: listUpcomingReminders
      parameters:
      - description: Latest reminder time to include (ISO-8601 instant)
        example: 2026-10-27T00:00:00Z
        in: query
        name: until
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListResponse"
          description: The pending reminders
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid until
      summary: "Reminders not fired yet, up to a time"
      tags:
      - Reminders
  /api/v1/reminders/{id}:
    delete:
      description: "Reminders never change after creation (only the server sets `firedAt`),\
        \ so no `If-Match` is needed."
      operationId: deleteReminder
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such reminder
      summary: Remove a reminder
      tags:
      - Reminders
    get:
      operationId: getReminder
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResponse"
          description: The reminder
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such reminder
      summary: One reminder
      tags:
      - Reminders
  /api/v1/search:
    get:
      description: "Every word of `q` must match the start of a word of an item's\
        \ title or text (exact or English-stemmed form); hits rank by relevance (title\
        \ before text) and recency. When that finds fewer than `limit` items, items\
        \ whose title is similar to `q` (typos, fragments) fill up the rest. Results\
        \ are grouped by type, groups ordered by their best hit; `limit` counts items\
        \ across all groups. Items in the Trash are not found. A query without letters\
        \ or digits finds nothing."
      operationId: search
      parameters:
      - description: Search text
        in: query
        name: q
        required: true
        schema:
          type: string
          maxLength: 200
          minLength: 1
      - description: Only these item types (comma-separated or repeated); all types
          when absent
        in: query
        name: types
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - TASK
            - PROJECT
            - NOTE
            - EVENT
            - EMAIL
            - FILE
            - FOLDER
            - CONTACT
            - BOOKMARK
            - JOURNAL_ENTRY
            - HABIT
      - description: "Maximum number of items, 1..50"
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 50
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
          description: "The matching items, grouped by type"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Blank or too long `q`, unknown type, or `limit` out of range"
      summary: Search all items
      tags:
      - Search
  /api/v1/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
          description: Every registered setting
          headers:
            ETag:
              description: "Version of the settings, for If-Match"
              schema:
                type: string
              style: simple
      summary: "All settings, unset ones with their defaults"
      tags:
      - Settings
    patch:
      description: "Sets the given keys; `null` resets a key to its default, keys\
        \ not sent stay unchanged. Nothing is changed when a key is unknown or a value\
        \ invalid (400, one error per key)."
      operationId: updateSettings
      parameters:
      - description: ETag from the last GET or PATCH
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
          description: Settings changed; all settings with the new ETag
          headers:
            ETag:
              description: New version of the settings
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unknown key or invalid value
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Change settings
      tags:
      - Settings
  /api/v1/setup:
    post:
      description: "Returns the TOTP secret and recovery codes exactly once. Calling\
        \ it again before the TOTP is confirmed replaces the pending account only\
        \ with the same username and password, or once the pending account is older\
        \ than 1 hour; otherwise it answers 409."
      operationId: startSetup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResponse"
          description: "Account created, TOTP confirmation pending"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid username or password
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Setup is already complete, or another setup is in progress"
      summary: Create the owner account and start the TOTP enrollment
      tags:
      - Setup
  /api/v1/setup/confirm-totp:
    post:
      operationId: confirmSetupTotp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTotpRequest"
        required: true
      responses:
        "204":
          description: "Setup complete, the account is active"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The code is not valid for the TOTP secret
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Setup is already complete, or was not started"
      summary: Activate the account with a code from the authenticator app
      tags:
      - Setup
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"
          description: OK
      summary: Whether the first-run setup still has to be completed
      tags:
      - Setup
  /api/v1/tasks:
    get:
      description: "Tasks matching every given filter, not in the Trash and not in\
        \ a tickler (`ticklerDate` after today). Due ticklers move back to the INBOX\
        \ and due SCHEDULED tasks to NEXT before the list is read. Open tasks (default)\
        \ are ordered by position, then id; with `completed=true` the done tasks (Logbook)\
        \ are returned, newest first. `due` is relative to today in the user's time\
        \ zone: OVERDUE before today, TODAY today, WEEK today and the next 6 days.\
        \ `maxMinutes` only matches tasks with an estimate."
      operationId: listTasks
      parameters:
      - description: Only tasks on this list
        in: query
        name: list
        required: false
        schema:
          type: string
          enum:
          - INBOX
          - NEXT
          - WAITING
          - SOMEDAY
          - SCHEDULED
      - description: Only tasks of this project
        in: query
        name: projectId
        required: false
        schema:
          type: string
          format: uuid
      - description: Only tasks with this context (id)
        in: query
        name: context
        required: false
        schema:
          type: string
          format: uuid
      - description: Only tasks with this energy
        in: query
        name: energy
        required: false
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
      - description: Only tasks with this creativity
        in: query
        name: creativity
        required: false
        schema:
          type: string
          enum:
          - ROUTINE
          - MIXED
          - CREATIVE
      - description: Only tasks estimated at most this many minutes
        in: query
        name: maxMinutes
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - description: Only tasks due in this window (case-insensitive)
        in: query
        name: due
        required: false
        schema:
          type: string
          enum:
          - overdue
          - today
          - week
      - description: "true: done tasks (Logbook) instead of open ones"
        in: query
        name: completed
        required: false
        schema:
          type: boolean
          default: false
      - description: Cursor from the previous page
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: "Page size, 1-200 (default 50)"
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPageResponse"
          description: One page of tasks
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid filter, cursor or limit"
      summary: List tasks
      tags:
      - Tasks
    post:
      description: "With a client-generated `id` (UUIDv7) the create is idempotent:\
        \ repeating it returns the existing task (200) unchanged."
      operationId: createTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: A task with this id already exists; it is returned unchanged
          headers:
            ETag:
              description: "Version of the task, for If-Match"
              schema:
                type: string
              style: simple
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: Created
          headers:
            ETag:
              description: "Version of the task, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid fields, an unknown project or context, or SCHEDULED\
            \ without a date"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The id belongs to a task in the Trash
      summary: Create a task
      tags:
      - Tasks
  /api/v1/tasks/{id}:
    delete:
      operationId: deleteTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the task
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "204":
          description: In the Trash
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task, or it is already in the Trash"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Move a task to the Trash
      tags:
      - Tasks
    get:
      description: "Due ticklers move back to the INBOX and due SCHEDULED tasks to\
        \ NEXT before the task is read, so its list, dates and ETag may differ from\
        \ an earlier read."
      operationId: getTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: The task
          headers:
            ETag:
              description: "Version of the task, for If-Match"
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task, or it is in the Trash"
      summary: One task
      tags:
      - Tasks
    patch:
      description: Only the fields sent change; `null` clears a field. Unknown fields
        (including `list`) are rejected.
      operationId: updateTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the task
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: Changed; the task with its new ETag
          headers:
            ETag:
              description: New version of the task
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task, or it is in the Trash"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Change a task
      tags:
      - Tasks
  /api/v1/tasks/{id}/complete:
    post:
      description: "Completing a done task keeps its completion time. `needsNextStep`\
        \ is true when the task is the next step of an ACTIVE project: the client\
        \ then asks for a new next step (`POST /projects/{id}/next-step`). `If-Match`\
        \ is optional."
      operationId: completeTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the task (optional)
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletedTaskResponse"
          description: "The done task with its new ETag, and whether its project needs\
            \ a new next step"
          headers:
            ETag:
              description: New version of the task
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task, or it is in the Trash"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match was sent and does not match the current ETag
      summary: Mark a task done
      tags:
      - Tasks
  /api/v1/tasks/{id}/move:
    post:
      description: See `MoveTaskRequest` for the rules of each list. `If-Match` is
        optional.
      operationId: moveTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the task (optional)
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
