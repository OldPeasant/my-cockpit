            \ (at most 50, 50 characters each)"
          items:
            type: string
        title:
          type: string
          maxLength: 500
        url:
          type: string
          description: Absolute http(s) URL
          maxLength: 2048
      required:
      - url
    CreateCalendarRequest:
      type: object
      description: A new local calendar (stored in the cockpit)
