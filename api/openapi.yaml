  /api/v1/calendar/events:
    get:
      description: "Every occurrence overlapping [from, to) of the events of the given\
        \ calendars (default: the visible ones), series expanded, ordered by start.\
        \ All-day events count by the days the range touches in the user's time zone.\
        \ The range is at most 400 days."
      operationId: listEventOccurrences
      parameters:
      - description: "Start of the range (inclusive), ISO-8601 date-time"
        in: query
        name: from
        required: true
        schema:
          type: string
          format: date-time
      - description: "End of the range (exclusive), ISO-8601 date-time"
        in: query
        name: to
        required: true
        schema:
          type: string
          format: date-time
      - description: Only these calendars (comma-separated or repeated); default the
          visible calendars
        in: query
        name: calendarIds
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrenceListResponse"
          description: The occurrences
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid range
      summary: Occurrences in a range
      tags:
      - Calendars
    post:
      description: "In a local or synced calendar (default: the default calendar);\
        \ in a synced one it is created at the provider first. With a client-generated\
        \ `id` (UUIDv7) the create is idempotent: repeating it returns the existing\
        \ event (200) unchanged."
      operationId: createEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: An event with this id already exists; it is returned unchanged
          headers:
            ETag:
              description: "Version of the event, for If-Match"
              schema:
                type: string
              style: simple
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: Created
          headers:
            ETag:
              description: "Version of the event, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid fields, an unknown calendar, or no calendar given\
            \ and no default calendar"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The id belongs to an event in the Trash, or the calendar is\
            \ read-only or cannot be changed"
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The calendar provider of a synced calendar failed; nothing
            was created
      summary: Create an event
      tags:
      - Calendars
  /api/v1/calendar/events/{id}:
    delete:
      description: "A single event or a whole series (ALL) goes to the Trash; THIS\
        \ removes one occurrence (EXDATE, or its override is cancelled); FOLLOWING\
        \ ends the series before the occurrence. Scope defaults as for PATCH. Events\
        \ of synced calendars are deleted at the provider first, and here for good\
        \ (no Trash)."
      operationId: deleteEvent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: Which occurrences of a series to delete
        in: query
        name: scope
        required: false
        schema:
          type: string
          enum:
          - THIS
          - FOLLOWING
          - ALL
      - description: "Original start of the occurrence: an instant (timed series)\
          \ or a date (all-day series)"
        in: query
        name: occurrence
        required: false
        schema:
          type: string
      - description: ETag of the addressed event
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Deleted
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid or unknown fields, or a missing, malformed or mismatching\
            \ occurrence"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such event or occurrence, or the event is in the Trash"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Changed concurrently, the calendar is read-only or cannot\
            \ be changed, a synced event cannot move to another calendar, or the event\
            \ was changed at the provider (the cockpit fetched the new version: reload\
            \ and retry)"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The calendar provider of a synced calendar failed; nothing
            was changed
      summary: Delete an event or occurrences of a series
      tags:
      - Calendars
    get:
      description: "An event, series master or override."
      operationId: getEvent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: The event
          headers:
            ETag:
              description: "Version of the event, for If-Match"
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such event, or it is in the Trash"
      summary: One event
      tags:
      - Calendars
    patch:
      description: "Only the fields sent change; `null` clears a field. For a series\
        \ master `scope` defaults to ALL; THIS and FOLLOWING need `occurrence`. THIS\
        \ changes the occurrence's override (created on first change), FOLLOWING splits\
        \ the series and returns the new series, ALL changes the master (overrides\
        \ that still had the old value of a field take the new one). Addressing an\
        \ override stands for its occurrence (`scope` defaults to THIS). A single\
        \ event ignores `scope`. Events of synced calendars are changed at the provider\
        \ first and cannot move to another calendar."
      operationId: updateEvent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: Which occurrences of a series to change
        in: query
        name: scope
        required: false
        schema:
          type: string
          enum:
          - THIS
          - FOLLOWING
          - ALL
      - description: "Original start of the occurrence: an instant (timed series)\
          \ or a date (all-day series)"
        in: query
        name: occurrence
        required: false
        schema:
          type: string
      - description: ETag of the addressed event
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventPatchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: "Changed; the event holding the change (event, override or\
            \ new series) with its ETag"
          headers:
            ETag:
              description: Version of the returned event
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid or unknown fields, or a missing, malformed or mismatching\
            \ occurrence"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such event or occurrence, or the event is in the Trash"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Changed concurrently, the calendar is read-only or cannot\
            \ be changed, a synced event cannot move to another calendar, or the event\
            \ was changed at the provider (the cockpit fetched the new version: reload\
            \ and retry)"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The calendar provider of a synced calendar failed; nothing
            was changed
      summary: Change an event or occurrences of a series
      tags:
      - Calendars
