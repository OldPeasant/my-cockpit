      description: "Moves a task to a list. SCHEDULED needs `scheduledDate` (only\
        \ allowed there); moving to WAITING sets `waitingSince` to today unless the\
        \ task was already waiting, the waiting-for fields are only allowed there.\
        \ Leaving WAITING clears the waiting-for fields, leaving SCHEDULED the scheduled\
        \ date. `ticklerDate` hides the task until that future date; omitted, it clears\
        \ the tickler."
