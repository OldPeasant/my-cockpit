openapi: 3.1.0
info:
  title: My Cockpit API
  version: v1
servers:
- url: /
tags:
- description: "Connections to Google and Microsoft accounts, shared by calendar,\
    \ mail and contacts"
  name: OAuth
- description: "Reminders for items of any type. When a reminder is due, the server\
    \ fires it once and sends the SSE event `reminder` on `GET /api/v1/events` with\
    \ a `ReminderResponse` as data. Every change also sends a `change` event of type\
    \ `REMINDER`."
  name: Reminders
- description: Change notifications (Server-Sent Events)
  name: Events
- description: Web login sessions and device tokens
  name: Auth
- description: GTD tasks
  name: Tasks
- description: Global search across all item types
  name: Search
- description: User settings
  name: Settings
- description: First-run creation of the owner account
  name: Setup
- description: Links between items of any type
  name: Links
- description: "Deleted items: list, restore, delete permanently"
  name: Trash
paths:
  /api/v1/auth/devices:
    get:
      operationId: listDevices
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceResponse"
          description: The devices
        "401":
          description: Not logged in
      summary: "Devices logged in with tokens, oldest first"
      tags:
      - Auth
  /api/v1/auth/devices/{id}:
    delete:
      operationId: revokeDevice
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Revoked
        "401":
          description: Not logged in
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such device
      summary: Revoke a device; its tokens stop working immediately
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      description: "Sends exactly one of `totp` and `recoveryCode`; a recovery code\
        \ works only once. On success the session cookie is set: persistent for a\
        \ sliding 30 days with `rememberDevice`, a browser-session cookie otherwise.\
        \ After 5 consecutive failures further attempts are blocked for an exponentially\
        \ growing time."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: "Logged in, session cookie set"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing fields, or not exactly one of totp and recoveryCode"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Wrong credentials (does not say which part was wrong)
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many failed attempts; retry after the given number of seconds
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
              style: simple
      summary: Log in with password and a TOTP or recovery code
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Logged out (also when there was no session)
      summary: End the current session and clear its cookie
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: Logged in
        "401":
          description: Not logged in
      summary: The logged-in user
      tags:
      - Auth
  /api/v1/auth/recovery-codes:
    post:
      description: "Needs a current TOTP code and shares the login throttle. Returns\
        \ 10 new single-use codes exactly once; all previous codes, used or not, stop\
        \ working."
      operationId: regenerateRecoveryCodes
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateRecoveryCodesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesResponse"
          description: New recovery codes
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid TOTP code
        "401":
          description: Not logged in
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Setup is not complete: there is no active account"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many failed attempts; retry after the given number of seconds
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
              style: simple
      summary: Replace all recovery codes with new ones
      tags:
      - Auth
  /api/v1/auth/token:
    post:
      description: "Takes the same credentials as the web login (exactly one of `totp`\
        \ and `recoveryCode`) plus a device name, and is throttled together with it.\
        \ The access token is valid for 15 minutes, the refresh token until it is\
        \ rotated or 90 days without a refresh. No CSRF token is needed."
      operationId: issueDeviceToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Device registered
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing fields, or not exactly one of totp and recoveryCode"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Wrong credentials (does not say which part was wrong)
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many failed attempts; retry after the given number of seconds
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
              style: simple
      summary: Log a device in and get its access and refresh tokens
      tags:
      - Auth
  /api/v1/auth/token/refresh:
    post:
      description: Returns a new access and refresh token; the refresh token sent
        is no longer valid. Sending a refresh token again after it was rotated revokes
        the device. No CSRF token is needed.
      operationId: refreshDeviceToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: New tokens
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing refresh token
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unknown, expired, already rotated or revoked refresh token"
      summary: Rotate a device's tokens
      tags:
      - Auth
  /api/v1/events:
    get:
      description: "A Server-Sent Events stream. Each committed change arrives as\
        \ an event named `change` whose data is a `ChangeEvent` JSON object; clients\
        \ refetch the item. Comment lines (`:heartbeat`) arrive every 25 seconds and\
        \ carry no data. Events are not replayed: after a reconnect, clients refetch\
        \ what they show. The server ends each stream after 15 minutes; clients reconnect\
        \ (EventSource does so automatically), which checks the login again."
      operationId: streamEvents
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChangeEvent"
          description: The event stream; each event's data is a ChangeEvent
        "401":
          description: Not logged in
      summary: Stream change notifications
      tags:
      - Events
  /api/v1/links:
    get:
      description: "Each linked item appears once: when several links connect the\
        \ two items (a manual link, inline links in either direction), the manual\
        \ one is returned, else the oldest. Oldest first by the returned link. Each\
        \ end is resolved by its module; an end whose item no longer exists or whose\
        \ type has no resolver yet is returned with `available: false` and only its\
        \ type and id."
      operationId: listLinks
      parameters:
      - description: Type of the item
        in: query
        name: type
        required: true
        schema:
          type: string
          enum:
          - TASK
          - PROJECT
          - NOTE
          - EVENT
          - EMAIL
          - FILE
          - FOLDER
          - CONTACT
          - BOOKMARK
          - JOURNAL_ENTRY
          - HABIT
      - description: Id of the item
        in: query
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkListResponse"
          description: The item's links (empty when it has none or does not exist)
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid type or id
      summary: "The links of an item, in both directions"
      tags:
      - Links
    post:
      description: "The link is shown on both items. Linking an item to itself, to\
        \ an item that does not exist, or a pair that already has a manual link (in\
        \ either direction) is rejected; inline links of the pair do not block it."
      operationId: createLink
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkResponse"
          description: Created; the response is the link as seen from the source
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid request, self-link, or an end that does not exist"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The items already have a manual link
      summary: Link two items
      tags:
      - Links
  /api/v1/links/{id}:
    delete:
      description: "Removes a link with origin `MANUAL` from both items. A link with\
        \ origin `SYNC` (e.g. an inline link in a note) is rejected with 409: the\
        \ next save of its source would recreate it, so it is removed by editing the\
        \ source. Links never change, so no `If-Match` is needed."
      operationId: deleteLink
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such link
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The link has origin `SYNC`; remove it in its source
      summary: Remove a manual link
      tags:
      - Links
  /api/v1/oauth/connections:
    get:
      operationId: listOAuthConnections
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OAuthConnectionResponse"
          description: All connections (tokens are never returned)
      summary: "The connected accounts with their status, oldest first"
      tags:
      - OAuth
  /api/v1/oauth/connections/{id}:
    delete:
      description: "Removes the connection and its tokens, and revokes the refresh\
        \ token at Google (Microsoft has no revocation endpoint: remove the app under\
        \ the account's privacy settings). Calendar sources and mail accounts using\
        \ the connection stop syncing."
      operationId: disconnectOAuthConnection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: The connection's ETag
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Disconnected
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such connection
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is stale
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Disconnect an account
      tags:
      - OAuth
    get:
      operationId: getOAuthConnection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthConnectionResponse"
          description: "The connection, with its version as ETag"
          headers:
            ETag:
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such connection
      summary: One connection
      tags:
      - OAuth
  /api/v1/oauth/providers:
    get:
      operationId: listOAuthProviders
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OAuthProviderResponse"
          description: Both providers
      summary: The providers and whether their OAuth app is configured
      tags:
      - OAuth
  /api/v1/oauth/{provider}/callback:
    get:
      description: "Accepts only the state of a pending flow of the same browser session,\
        \ exchanges the code and stores the encrypted refresh token. Redirects to\
        \ `/settings/integrations` with `oauth=connected&provider=&purpose=&connectionId=`\
        \ or `oauth=error&provider=&error=` (`invalid_state`, `access_denied`, `token_exchange_failed`,\
        \ `no_refresh_token`) and, when known, `purpose=`."
      operationId: completeOAuthConnection
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
          enum:
          - google
          - microsoft
      - in: query
        name: code
        required: false
        schema:
          type: string
      - in: query
        name: state
        required: false
        schema:
          type: string
      - in: query
        name: error
        required: false
        schema:
          type: string
      responses:
        "302":
          description: Redirect to the SPA
          headers:
            Location:
              description: The SPA page showing the outcome
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unknown provider
      summary: The provider's redirect back (browser navigation)
      tags:
      - OAuth
  /api/v1/oauth/{provider}/start:
    get:
      description: "Redirects to the provider's consent screen (authorization code\
        \ flow with PKCE) asking for the combined calendar, mail and contacts scopes.\
        \ The flow is bound to the current browser session and expires after 10 minutes.\
        \ Connecting an account that is already connected updates that connection."
      operationId: startOAuthConnection
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
          enum:
          - google
          - microsoft
      - description: What the account is connected for; passed back to the SPA after
          the callback
        in: query
        name: purpose
        required: true
        schema:
          type: string
          enum:
          - CALENDAR
          - MAIL
          - CONTACTS
      responses:
        "302":
          content:
            '*/*':
              schema:
                type: object
          description: Redirect to the provider
          headers:
            Location:
              description: The provider's authorization URL
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or unknown purpose
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No browser session
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unknown provider
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The provider's OAuth app is not configured on this server
      summary: Start connecting a provider account (browser navigation)
      tags:
      - OAuth
  /api/v1/reminders:
    get:
      description: "All reminders of the item, fired or not, earliest first."
      operationId: listReminders
      parameters:
      - description: Type of the item
        in: query
        name: itemType
        required: true
        schema:
          type: string
          enum:
          - TASK
          - PROJECT
          - NOTE
          - EVENT
          - EMAIL
          - FILE
          - FOLDER
          - CONTACT
          - BOOKMARK
          - JOURNAL_ENTRY
          - HABIT
      - description: Id of the item
        in: query
        name: itemId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListResponse"
          description: The item's reminders (empty when it has none or does not exist)
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid itemType or itemId
      summary: The reminders of an item
      tags:
      - Reminders
    post:
      description: "A time in the past is allowed: the reminder fires on the next\
        \ scheduler run (within seconds). An item that does not exist is rejected;\
        \ an item whose type has no module yet is accepted."
      operationId: createReminder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReminderRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResponse"
          description: Created; `Location` points to the reminder
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid request or unknown item
      summary: Add a reminder to an item
      tags:
      - Reminders
  /api/v1/reminders/upcoming:
    get:
      description: "Reminders that have not fired yet and are due at or before `until`,\
        \ overdue ones included, earliest first, at most 1000. The Android app schedules\
        \ local alarms from them."
      operationId: listUpcomingReminders
      parameters:
      - description: Latest reminder time to include (ISO-8601 instant)
        example: 2026-10-27T00:00:00Z
        in: query
        name: until
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListResponse"
          description: The pending reminders
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid until
      summary: "Reminders not fired yet, up to a time"
      tags:
      - Reminders
  /api/v1/reminders/{id}:
    delete:
      description: "Reminders never change after creation (only the server sets `firedAt`),\
        \ so no `If-Match` is needed."
      operationId: deleteReminder
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such reminder
      summary: Remove a reminder
      tags:
      - Reminders
    get:
      operationId: getReminder
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResponse"
          description: The reminder
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such reminder
      summary: One reminder
      tags:
      - Reminders
  /api/v1/search:
    get:
      description: "Every word of `q` must match the start of a word of an item's\
        \ title or text (exact or English-stemmed form); hits rank by relevance (title\
        \ before text) and recency. When that finds fewer than `limit` items, items\
        \ whose title is similar to `q` (typos, fragments) fill up the rest. Results\
        \ are grouped by type, groups ordered by their best hit; `limit` counts items\
        \ across all groups. Items in the Trash are not found. A query without letters\
        \ or digits finds nothing."
      operationId: search
      parameters:
      - description: Search text
        in: query
        name: q
        required: true
        schema:
          type: string
          maxLength: 200
          minLength: 1
      - description: Only these item types (comma-separated or repeated); all types
          when absent
        in: query
        name: types
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - TASK
            - PROJECT
            - NOTE
            - EVENT
            - EMAIL
            - FILE
            - FOLDER
            - CONTACT
            - BOOKMARK
            - JOURNAL_ENTRY
            - HABIT
      - description: "Maximum number of items, 1..50"
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 50
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
          description: "The matching items, grouped by type"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Blank or too long `q`, unknown type, or `limit` out of range"
      summary: Search all items
      tags:
      - Search
  /api/v1/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
          description: Every registered setting
          headers:
            ETag:
              description: "Version of the settings, for If-Match"
              schema:
                type: string
              style: simple
      summary: "All settings, unset ones with their defaults"
      tags:
      - Settings
    patch:
      description: "Sets the given keys; `null` resets a key to its default, keys\
        \ not sent stay unchanged. Nothing is changed when a key is unknown or a value\
        \ invalid (400, one error per key)."
      operationId: updateSettings
      parameters:
      - description: ETag from the last GET or PATCH
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
          description: Settings changed; all settings with the new ETag
          headers:
            ETag:
              description: New version of the settings
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unknown key or invalid value
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Change settings
      tags:
      - Settings
  /api/v1/setup:
    post:
      description: "Returns the TOTP secret and recovery codes exactly once. Calling\
        \ it again before the TOTP is confirmed replaces the pending account only\
        \ with the same username and password, or once the pending account is older\
        \ than 1 hour; otherwise it answers 409."
      operationId: startSetup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResponse"
          description: "Account created, TOTP confirmation pending"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid username or password
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Setup is already complete, or another setup is in progress"
      summary: Create the owner account and start the TOTP enrollment
      tags:
      - Setup
  /api/v1/setup/confirm-totp:
    post:
      operationId: confirmSetupTotp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTotpRequest"
        required: true
      responses:
        "204":
          description: "Setup complete, the account is active"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The code is not valid for the TOTP secret
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Setup is already complete, or was not started"
      summary: Activate the account with a code from the authenticator app
      tags:
      - Setup
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"
          description: OK
      summary: Whether the first-run setup still has to be completed
      tags:
      - Setup
  /api/v1/tasks:
    get:
      description: "Tasks matching every given filter, not in the Trash. Open tasks\
        \ (default) are ordered by position, then id; with `completed=true` the done\
        \ tasks (Logbook) are returned, newest first. `due` is relative to today in\
        \ the user's time zone: OVERDUE before today, TODAY today, WEEK today and\
        \ the next 6 days. `maxMinutes` only matches tasks with an estimate."
      operationId: listTasks
      parameters:
      - description: Only tasks on this list
        in: query
        name: list
        required: false
        schema:
          type: string
          enum:
          - INBOX
          - NEXT
          - WAITING
          - SOMEDAY
          - SCHEDULED
      - description: Only tasks of this project
        in: query
        name: projectId
        required: false
        schema:
          type: string
          format: uuid
      - description: Only tasks with this context (id)
        in: query
        name: context
        required: false
        schema:
          type: string
          format: uuid
      - description: Only tasks with this energy
        in: query
        name: energy
        required: false
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
      - description: Only tasks with this creativity
        in: query
        name: creativity
        required: false
        schema:
          type: string
          enum:
          - ROUTINE
          - MIXED
          - CREATIVE
      - description: Only tasks estimated at most this many minutes
        in: query
        name: maxMinutes
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - description: Only tasks due in this window (case-insensitive)
        in: query
        name: due
        required: false
        schema:
          type: string
          enum:
          - overdue
          - today
          - week
      - description: "true: done tasks (Logbook) instead of open ones"
        in: query
        name: completed
        required: false
        schema:
          type: boolean
          default: false
      - description: Cursor from the previous page
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: "Page size, 1-200 (default 50)"
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPageResponse"
          description: One page of tasks
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid filter, cursor or limit"
      summary: List tasks
      tags:
      - Tasks
    post:
      description: "With a client-generated `id` (UUIDv7) the create is idempotent:\
        \ repeating it returns the existing task (200) unchanged."
      operationId: createTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: A task with this id already exists; it is returned unchanged
          headers:
            ETag:
              description: "Version of the task, for If-Match"
              schema:
                type: string
              style: simple
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: Created
          headers:
            ETag:
              description: "Version of the task, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid fields, an unknown project or context, or SCHEDULED\
            \ without a date"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The id belongs to a task in the Trash
      summary: Create a task
      tags:
      - Tasks
  /api/v1/tasks/{id}:
    delete:
      operationId: deleteTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the task
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "204":
          description: In the Trash
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task, or it is already in the Trash"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Move a task to the Trash
      tags:
      - Tasks
    get:
      operationId: getTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: The task
          headers:
            ETag:
              description: "Version of the task, for If-Match"
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task, or it is in the Trash"
      summary: One task
      tags:
      - Tasks
    patch:
      description: Only the fields sent change; `null` clears a field. Unknown fields
        (including `list`) are rejected.
      operationId: updateTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the task
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: Changed; the task with its new ETag
          headers:
            ETag:
              description: New version of the task
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task, or it is in the Trash"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Change a task
      tags:
      - Tasks
  /api/v1/tasks/{id}/complete:
    post:
      description: Completing a done task keeps its completion time. `If-Match` is
        optional.
      operationId: completeTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the task (optional)
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: The changed task with its new ETag
          headers:
            ETag:
              description: New version of the task
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task, or it is in the Trash"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match was sent and does not match the current ETag
      summary: Mark a task done
      tags:
      - Tasks
  /api/v1/tasks/{id}/move:
    post:
      description: See `MoveTaskRequest` for the rules of each list. `If-Match` is
        optional.
      operationId: moveTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the task (optional)
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveTaskRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: The changed task with its new ETag
          headers:
            ETag:
              description: New version of the task
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task, or it is in the Trash"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match was sent and does not match the current ETag
      summary: Move a task to another list (processing)
      tags:
      - Tasks
  /api/v1/tasks/{id}/uncomplete:
    post:
      description: The task returns to the list it was on. `If-Match` is optional.
      operationId: uncompleteTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the task (optional)
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: The changed task with its new ETag
          headers:
            ETag:
              description: New version of the task
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task, or it is in the Trash"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match was sent and does not match the current ETag
      summary: Make a done task open again
      tags:
      - Tasks
  /api/v1/tasks/{taskId}/checklist:
    get:
      operationId: listChecklistItems
      parameters:
      - in: path
        name: taskId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ChecklistResponse"
          description: The items in order
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task, or it is in the Trash"
      summary: A task's checklist
      tags:
      - Tasks
    post:
      operationId: createChecklistItem
      parameters:
      - in: path
        name: taskId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChecklistItemRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItemResponse"
          description: Created
          headers:
            ETag:
              description: "Version of the item, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing, blank or too long text"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task, or it is in the Trash"
      summary: Add a checklist item at the end
      tags:
      - Tasks
  /api/v1/tasks/{taskId}/checklist/{itemId}:
    delete:
      operationId: deleteChecklistItem
      parameters:
      - in: path
        name: taskId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: itemId
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the item
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such task or item
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Remove a checklist item
      tags:
      - Tasks
    patch:
      operationId: updateChecklistItem
      parameters:
      - in: path
        name: taskId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: itemId
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the item
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChecklistItemRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItemResponse"
          description: Changed; the item with its new ETag
          headers:
            ETag:
              description: New version of the item
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Blank or too long text
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such task or item
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: "Change a checklist item (text, done, position)"
      tags:
      - Tasks
  /api/v1/trash:
    get:
      description: "Most recently deleted first (ties by type, then id). Items are\
        \ purged automatically at `purgeAt`, 30 days after their deletion."
      operationId: listTrash
      parameters:
      - description: Opaque cursor from the previous page's `nextCursor`
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: "Page size, 1..200 (default 50)"
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashPageResponse"
          description: One page of the Trash
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid cursor or limit
      summary: Deleted items of all types
      tags:
      - Trash
  /api/v1/trash/{type}/{id}:
    delete:
      description: Only items in the Trash can be deleted permanently; their links
        are removed as well.
      operationId: purgeTrashItem
      parameters:
      - description: Type of the item
        in: path
        name: type
        required: true
        schema:
          type: string
          enum:
          - TASK
          - PROJECT
          - NOTE
          - EVENT
          - EMAIL
          - FILE
          - FOLDER
          - CONTACT
          - BOOKMARK
          - JOURNAL_ENTRY
          - HABIT
      - description: Id of the item
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Deleted permanently
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid type or id
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such item in the Trash
      summary: Delete an item permanently
      tags:
      - Trash
  /api/v1/trash/{type}/{id}/restore:
    post:
      operationId: restoreTrashItem
      parameters:
      - description: Type of the item
        in: path
        name: type
        required: true
        schema:
          type: string
          enum:
          - TASK
          - PROJECT
          - NOTE
          - EVENT
          - EMAIL
          - FILE
          - FOLDER
          - CONTACT
          - BOOKMARK
          - JOURNAL_ENTRY
          - HABIT
      - description: Id of the item
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Restored
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid type or id
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such item in the Trash
      summary: Restore a deleted item
      tags:
      - Trash
components:
  schemas:
    ChangeEvent:
      type: object
      description: A change notification. Clients refetch the item; the event carries
        no item contents.
      properties:
        at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        op:
          type: string
          enum:
          - CREATED
          - UPDATED
          - DELETED
        type:
          type: string
          description: Item type (an ItemType name such as TASK) or another notification
            kind
          example: TASK
      required:
      - at
      - id
      - op
      - type
    ChecklistItemResponse:
      type: object
      description: A sub-step of a task. `version` is also sent as the ETag.
      properties:
        done:
          type: boolean
        id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
        taskId:
          type: string
          format: uuid
        text:
          type: string
        version:
          type: integer
          format: int64
      required:
      - done
      - id
      - position
      - taskId
      - text
      - version
    ChecklistResponse:
      type: object
      description: A task's checklist in order
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItemResponse"
      required:
      - items
    ConfirmTotpRequest:
      type: object
      properties:
        code:
          type: string
          description: Current 6-digit code from the authenticator app
          example: 123456
          minLength: 1
      required:
      - code
    CreateChecklistItemRequest:
      type: object
      description: "A new checklist item, added at the end"
      properties:
        done:
          type: boolean
        text:
          type: string
          maxLength: 1000
      required:
      - text
    CreateLinkRequest:
      type: object
      properties:
        label:
          type: string
          description: "Optional short label, e.g. \"origin\""
          maxLength: 200
          minLength: 0
        source:
          $ref: "#/components/schemas/ItemRefDto"
        target:
          $ref: "#/components/schemas/ItemRefDto"
      required:
      - source
      - target
    CreateReminderRequest:
      type: object
      properties:
        channel:
          type: string
          description: Defaults to NOTIFICATION
          enum:
          - NOTIFICATION
        itemId:
          type: string
          format: uuid
        itemType:
          type: string
          enum:
          - TASK
          - PROJECT
          - NOTE
          - EVENT
          - EMAIL
          - FILE
          - FOLDER
          - CONTACT
          - BOOKMARK
          - JOURNAL_ENTRY
          - HABIT
        remindAt:
          type: string
          format: date-time
          description: When to remind (ISO-8601 instant)
      required:
      - itemId
      - itemType
      - remindAt
    CreateTaskRequest:
      type: object
      description: A new task. Only `title` is required; it goes to the Inbox unless
        `list` says otherwise.
      properties:
        contextIds:
          type: array
          items:
            type: string
            format: uuid
        creativity:
          type: string
          enum:
          - ROUTINE
          - MIXED
          - CREATIVE
        dueDate:
          type: string
          format: date
        dueTime:
          type: string
          format: time
          description: Only together with `dueDate`
          example: 14:30:00
        energy:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        id:
          type: string
          format: uuid
          description: Client-generated UUIDv7 for an idempotent create (offline capture)
        list:
          type: string
          description: "Default INBOX; SCHEDULED needs `scheduledDate` (only allowed\
            \ there), WAITING sets `waitingSince` to today (the waiting-for fields\
            \ and `waitingSince` are only allowed there)"
          enum:
          - INBOX
          - NEXT
          - WAITING
          - SOMEDAY
          - SCHEDULED
        notesMd:
          type: string
        position:
