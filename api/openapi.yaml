        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Restored
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid type or id
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such item in the Trash
      summary: Restore a deleted item
      tags:
      - Trash
  /api/v1/uploads:
    post:
      description: The response tells the chunk size and count. Uploads not completed
        within 7 days are deleted.
      operationId: createUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found or in the Trash (or, when given, the target folder)"
      summary: Start a resumable upload
      tags:
      - Files
  /api/v1/uploads/{id}:
    delete:
      description: Deletes the chunks sent so far.
      operationId: abortUpload
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Aborted
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found or in the Trash (or, when given, the target folder)"
      summary: Abort an upload
      tags:
      - Files
    get:
      description: "Which chunks arrived, to resume an upload."
      operationId: getUpload
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
          description: The upload
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found or in the Trash (or, when given, the target folder)"
      summary: State of an upload
      tags:
      - Files
  /api/v1/uploads/{id}/chunks/{n}:
    put:
      description: "Chunk `n` (0-based) with exactly `chunkSize` bytes, the last chunk\
        \ with the rest. Sending a chunk again replaces it."
      operationId: putUploadChunk
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: "n"
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "204":
          description: Stored
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found or in the Trash (or, when given, the target folder)"
      summary: Send one chunk
      tags:
      - Files
  /api/v1/uploads/{id}/complete:
    post:
      description: "Assembles the chunks into a file, after checking that all arrived\
        \ (409 lists the missing ones) and that the content has the declared size\
        \ and the given SHA-256 (400 otherwise; the upload stays open). Ends the upload."
      operationId: completeUpload
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
          description: The new file
          headers:
            ETag:
              description: "Version of the file, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found or in the Trash (or, when given, the target folder)"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Chunks are missing
      summary: Complete an upload
      tags:
      - Files
components:
  schemas:
    AreaListResponse:
      type: object
      description: All areas in order
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AreaResponse"
      required:
      - items
    AreaResponse:
      type: object
      description: An area of focus. `version` is also sent as the ETag.
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
        title:
          type: string
        version:
          type: integer
          format: int64
      required:
      - id
      - position
      - title
      - version
    AttendeeDto:
      type: object
      description: An invited person
      properties:
        email:
          type: string
          maxLength: 320
        name:
          type: string
          maxLength: 200
        status:
          type: string
          description: Default NEEDS_ACTION
          enum:
          - NEEDS_ACTION
          - ACCEPTED
          - DECLINED
          - TENTATIVE
          - DELEGATED
      required:
      - email
    BackupJobResponse:
      type: object
      description: A backup job
      properties:
        createdAt:
          type: string
          format: date-time
        fileName:
          type: string
          description: "File name of the zip, once completed"
          example: cockpit-backup-2026-10-20T1530Z.zip
        finishedAt:
          type: string
          format: date-time
          description: When the backup completed or failed
        id:
          type: string
          format: uuid
        size:
          type: integer
          format: int64
          description: "Size of the zip in bytes, once completed"
        state:
          type: string
          enum:
          - RUNNING
          - COMPLETED
          - FAILED
        step:
          type: string
          description: "What the backup is doing, e.g. `gtd: data`"
        stepsDone:
          type: integer
          format: int32
          description: Steps finished
        stepsTotal:
          type: integer
          format: int32
          description: Steps in total
      required:
      - createdAt
      - id
      - state
      - step
      - stepsDone
      - stepsTotal
    BookmarkPageResponse:
      type: object
      description: One page of bookmarks
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BookmarkResponse"
        nextCursor:
          type: string
          description: Cursor of the next page; `null` on the last page
      required:
      - items
    BookmarkPatchRequest:
      type: object
      description: "Changes to a bookmark: only the fields sent change; `null` clears\
        \ `title` and `description` (the others cannot be null). A new `url` clears\
        \ the favicon and fetches the page metadata again."
      properties:
        description:
          type:
          - string
          - "null"
          maxLength: 2000
        read:
          type: boolean
          description: "true: mark as read now (keeps an earlier read time), false:\
            \ mark as unread"
        readLater:
          type: boolean
        tags:
          type: array
          description: The complete new list of tags
          items:
            type: string
        title:
          type:
          - string
          - "null"
          maxLength: 500
        url:
          type: string
          maxLength: 2048
    BookmarkResponse:
      type: object
      description: A bookmark. `version` is also sent as the ETag.
      properties:
        createdAt:
          type: string
          format: date-time
        description:
          type: string
          description: As set or fetched from the page
        displayTitle:
          type: string
          description: "The title, or else the host of the URL"
        favicon:
          type: string
          description: "Absolute http(s) URL of the site's icon, fetched from the\
            \ page"
        id:
          type: string
          format: uuid
        metadataStatus:
          type: string
          description: "Whether title, description and favicon were fetched from the\
            \ page after the URL was saved. The fetch runs in the background; when\
            \ it finishes the bookmark changes (new ETag) and a change event is sent."
          enum:
          - PENDING
          - FETCHED
          - FAILED
        readAt:
          type: string
          format: date-time
          description: When it was marked as read; `null` while unread
        readLater:
          type: boolean
          description: In the read-later list
        snapshotFileId:
          type: string
          format: uuid
          description: File with a readable copy of the page
        tags:
          type: array
          description: Ordered regardless of case
          items:
            type: string
        title:
          type: string
          description: As set or fetched from the page; `null` when there is none
        updatedAt:
          type: string
          format: date-time
        url:
          type: string
          description: Absolute http(s) URL
        version:
          type: integer
          format: int64
      required:
      - createdAt
      - displayTitle
      - id
      - metadataStatus
      - readLater
      - tags
      - updatedAt
      - url
      - version
    BookmarkTagListResponse:
      type: object
      description: "Every bookmark tag in use, ordered regardless of case"
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BookmarkTagResponse"
      required:
      - items
    BookmarkTagResponse:
      type: object
      description: A tag and the number of bookmarks (not in the Trash) that have
        it
      properties:
        count:
          type: integer
          format: int64
        tag:
          type: string
      required:
      - count
      - tag
    CalendarListResponse:
      type: object
      description: "Every calendar, ordered by name"
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CalendarResponse"
      required:
      - items
    CalendarPatchRequest:
      type: object
      description: "Changes to a calendar: only the fields sent change. `isDefault:\
        \ true` makes it the calendar for new events (the previous default loses the\
        \ flag). `color` can be cleared with `null`."
      properties:
        color:
          type:
          - string
          - "null"
          example: "#3366ff"
        isDefault:
          type: boolean
        name:
          type: string
          maxLength: 200
        visible:
          type: boolean
    CalendarResponse:
      type: object
      description: A calendar. `version` is also sent as the ETag.
      properties:
        color:
          type: string
          description: CSS hex color
          example: "#3366ff"
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        isDefault:
          type: boolean
          description: The calendar for new events (at most one)
        name:
          type: string
        readOnly:
          type: boolean
          description: Its events cannot be changed
        sourceId:
          type: string
          format: uuid
        sourceType:
          type: string
          enum:
          - LOCAL
          - GOOGLE
          - MICROSOFT
          - CALDAV
          - ICS_FEED
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
        visible:
          type: boolean
          description: Shown in the calendar views
      required:
      - createdAt
      - id
      - isDefault
      - name
      - readOnly
      - sourceId
      - sourceType
      - updatedAt
      - version
      - visible
    CalendarSourceListResponse:
      type: object
      description: Every calendar source in creation order
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CalendarSourceResponse"
      required:
      - items
    CalendarSourceResponse:
      type: object
      description: "A calendar source: the local calendars, or a connected account\
        \ or feed. Settings and secrets are not shown."
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
        sync:
          $ref: "#/components/schemas/SyncStatusResponse"
          description: Sync status; null when the source is not synced
        syncable:
          type: boolean
          description: Whether the source is synced with its provider (false for LOCAL
            and for types without support yet)
        type:
          type: string
          enum:
          - LOCAL
          - GOOGLE
          - MICROSOFT
          - CALDAV
          - ICS_FEED
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
      required:
      - createdAt
      - id
      - name
      - syncable
      - type
      - updatedAt
      - version
    CaptureContextResponse:
      type: object
      description: A context named with `@`
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    CapturePreviewRequest:
      type: object
      description: A text to preview the capture syntax of
      properties:
        text:
          type: string
          maxLength: 100000
          minLength: 0
      required:
      - text
    CapturePreviewResponse:
      type: object
      description: "What a capture of the text creates. Only the title line (the first\
        \ non-blank line) is parsed; the rest of the text is kept as it is. Syntax\
        \ (a token starts the line or follows whitespace): `#project` an existing\
        \ project by title (case-insensitive, `-`/`_` for spaces), `@context` an existing\
        \ context, `!today`, `!tomorrow` or `!YYYY-MM-DD` the due date, `^waiting`\
        \ the WAITING list (`^name`: waiting for name). Recognized tokens are removed\
        \ from the title; unknown ones stay as text. A title line of only recognized\
        \ tokens makes the next non-blank line the (unparsed) title."
      properties:
        contexts:
          type: array
          items:
            $ref: "#/components/schemas/CaptureContextResponse"
        dueDate:
          type: string
          format: date
          description: Local date in the user's time zone
        extraNotes:
          type: string
          description: "The rest of the text, put in front of the notes"
        list:
          type: string
          description: "INBOX, or WAITING with a `^` token"
          enum:
          - INBOX
          - NEXT
          - WAITING
          - SOMEDAY
          - SCHEDULED
        project:
          $ref: "#/components/schemas/CaptureProjectResponse"
        title:
          type: string
          description: The task title; empty when the text has none
        waitingFor:
          type: string
          description: Free text of `^name`
      required:
      - contexts
      - list
      - title
    CaptureProjectResponse:
      type: object
      description: A project named with `#`
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
      required:
      - id
      - title
    CaptureRequest:
      type: object
      description: "A quick capture. The first non-blank line of `text` becomes the\
        \ title, further lines go in front of `notes`. With `parse` (default true)\
        \ the capture syntax is applied to the title line, see `POST /capture/preview`;\
        \ a title line of only recognized tokens makes the next non-blank line the\
        \ (unparsed) title."
      properties:
        fileIds:
          type: array
          description: Uploaded files to link to the task (at most 50)
          items:
            type: string
            format: uuid
          maxItems: 50
          minItems: 0
        id:
          type: string
          format: uuid
          description: Client-generated UUIDv7 for an idempotent capture (offline
            queue)
        notes:
          type: string
          description: Markdown notes of the task
        parse:
          type: boolean
          description: Apply the capture syntax (default true); false keeps the text
            as it is
        text:
          type: string
          maxLength: 100000
          minLength: 0
      required:
      - text
    ChangeEvent:
      type: object
      description: A change notification. Clients refetch the item; the event carries
        no item contents.
      properties:
        at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        op:
          type: string
          enum:
          - CREATED
          - UPDATED
          - DELETED
        type:
          type: string
          description: Item type (an ItemType name such as TASK) or another notification
            kind
          example: TASK
      required:
      - at
      - id
      - op
      - type
    ChecklistItemResponse:
      type: object
      description: A sub-step of a task. `version` is also sent as the ETag.
      properties:
        done:
          type: boolean
        id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
        taskId:
          type: string
          format: uuid
        text:
          type: string
        version:
          type: integer
          format: int64
      required:
      - done
      - id
      - position
      - taskId
      - text
      - version
    ChecklistResponse:
      type: object
      description: A task's checklist in order
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItemResponse"
      required:
      - items
    CompleteUploadRequest:
      type: object
      description: Completes an upload
      properties:
        sha256:
          type: string
          description: Hex SHA-256 of the whole file
      required:
      - sha256
    CompletedTaskResponse:
      type: object
      description: "A task after `/complete`: the task's fields, and whether its project\
        \ needs a new next step"
      properties:
        completedAt:
          type: string
          format: date-time
          description: When the task was done; `null` while it is open
        contextIds:
          type: array
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
        creativity:
          type: string
          enum:
          - ROUTINE
          - MIXED
          - CREATIVE
        dueDate:
          type: string
          format: date
          description: Local date in the user's time zone
        dueTime:
          type: string
          format: time
          example: 14:30:00
        energy:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        id:
          type: string
          format: uuid
        list:
          type: string
          enum:
          - INBOX
          - NEXT
          - WAITING
          - SOMEDAY
          - SCHEDULED
        needsNextStep:
          type: boolean
          description: "The task was the next step of an ACTIVE project, which is\
            \ now stalled: ask the user for a new next step"
        notesMd:
          type: string
        position:
          type: integer
          format: int32
          description: "Order within the project, or within the list for tasks without\
            \ a project"
        projectId:
          type: string
          format: uuid
        recurrenceMode:
          type: string
          enum:
          - FIXED
          - AFTER_COMPLETION
        recurrenceRule:
          type: string
          description: iCalendar RRULE without the `RRULE:` prefix
          example: FREQ=WEEKLY;BYDAY=MO
        scheduledDate:
          type: string
          format: date
        ticklerDate:
          type: string
          format: date
          description: "While set, the task is hidden; on that date it returns to\
            \ the Inbox"
        timeEstimateMin:
          type: integer
          format: int32
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
        waitingForContactId:
          type: string
          format: uuid
        waitingForText:
          type: string
        waitingSince:
          type: string
          format: date
      required:
      - contextIds
      - createdAt
      - id
      - list
      - needsNextStep
      - position
      - title
      - updatedAt
      - version
    ConfirmRestoreRequest:
      type: object
      description: Options of a restore
      properties:
        passphrase:
          type: string
          format: password
          description: "The backup's passphrase, to restore its secrets"
          maxLength: 256
          minLength: 0
    ConfirmTotpEnrollmentRequest:
      type: object
      properties:
        code:
          type: string
          description: Current 6-digit code from the authenticator app
          example: 123456
          maxLength: 16
          minLength: 0
      required:
      - code
    ConfirmTotpRequest:
      type: object
      properties:
        code:
          type: string
          description: Current 6-digit code from the authenticator app
          example: 123456
          minLength: 1
      required:
      - code
    ConnectionTestResponse:
      type: object
      properties:
        imap:
          $ref: "#/components/schemas/ProtocolTestResponse"
        smtp:
          $ref: "#/components/schemas/ProtocolTestResponse"
      required:
      - imap
      - smtp
    ContactAddressDto:
      type: object
      description: A postal address of a contact; at least one part must be set
      properties:
        city:
          type: string
        country:
          type: string
        label:
          type: string
          description: "Free text, e.g. `home`"
        postalCode:
          type: string
        region:
          type: string
        street:
          type: string
    ContactEmailDto:
      type: object
      description: An email address of a contact
      properties:
        address:
          type: string
        label:
          type: string
          description: "Free text, e.g. `work` or `home`"
      required:
      - address
    ContactEventDto:
      type: object
      description: An occurrence of an event with the contact
      properties:
        allDay:
          type: boolean
        calendarId:
          type: string
          format: uuid
        end:
          type: string
          format: date-time
        endDate:
          type: string
          format: date
          description: Exclusive
        eventId:
          type: string
          format: uuid
        location:
          type: string
        occurrence:
          type: string
          description: "Original start of the occurrence: an instant, or a date for\
            \ all-day series"
        seriesId:
          type: string
          format: uuid
        start:
          type: string
          format: date-time
        startDate:
          type: string
          format: date
        title:
          type: string
      required:
      - allDay
      - calendarId
      - eventId
      - title
    ContactMailAddressDto:
      type: object
      description: "A mailbox: address plus optional display name"
      properties:
        address:
          type: string
        name:
          type: string
      required:
      - address
    ContactMailDto:
      type: object
      description: "Headers of a mail from/to the contact (`GET /mail/messages/{id}`\
        \ has the body)"
      properties:
        accountId:
          type: string
          format: uuid
        direction:
          type: string
          description: "Whether the contact sent the mail (FROM) or received it (TO,\
            \ also Cc)"
          enum:
          - FROM
          - TO
        from:
          type: array
          items:
            $ref: "#/components/schemas/ContactMailAddressDto"
        id:
          type: string
          format: uuid
        receivedAt:
          type: string
          format: date-time
          description: Arrival in the mailbox
        seen:
          type: boolean
        sentAt:
          type: string
          format: date-time
          description: The Date header
        subject:
          type: string
        to:
          type: array
          items:
            $ref: "#/components/schemas/ContactMailAddressDto"
      required:
      - accountId
      - direction
      - from
      - id
      - seen
      - to
    ContactPageResponse:
      type: object
      description: One page of contacts
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContactResponse"
        nextCursor:
          type: string
          description: Cursor of the next page; `null` on the last page
      required:
      - items
    ContactPhoneDto:
      type: object
      description: "A phone number of a contact, as entered"
      properties:
        label:
          type: string
          description: "Free text, e.g. `mobile` or `work`"
        number:
          type: string
      required:
      - number
    ContactRelatedResponse:
      type: object
      description: What the cockpit knows about a contact besides its own fields
      properties:
        contactId:
          type: string
          format: uuid
        events:
          type: array
          description: "Occurrences in the next 90 days with one of the contact's\
            \ addresses as attendee, by start"
          items:
            $ref: "#/components/schemas/ContactEventDto"
        mails:
          type: array
          description: "Newest mails from/to the contact's addresses, newest first"
          items:
            $ref: "#/components/schemas/ContactMailDto"
        waitingFor:
