              description: "Version of the task, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid fields, a text without a title, an id that is not\
            \ a UUIDv7 or an unknown file"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The id belongs to a task in the Trash
