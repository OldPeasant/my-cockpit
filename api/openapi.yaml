      - Tasks
  /api/v1/trash:
    get:
      description: "Most recently deleted first (ties by type, then id). Items are\
        \ purged automatically at `purgeAt`, 30 days after their deletion."
      operationId: listTrash
      parameters:
      - description: Opaque cursor from the previous page's `nextCursor`
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: "Page size, 1..200 (default 50)"
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashPageResponse"
          description: One page of the Trash
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid cursor or limit
      summary: Deleted items of all types
      tags:
      - Trash
  /api/v1/trash/{type}/{id}:
    delete:
      description: Only items in the Trash can be deleted permanently; their links
        are removed as well.
      operationId: purgeTrashItem
      parameters:
      - description: Type of the item
        in: path
        name: type
        required: true
        schema:
          type: string
          enum:
          - TASK
          - PROJECT
          - NOTE
          - EVENT
          - EMAIL
          - FILE
          - FOLDER
          - CONTACT
          - BOOKMARK
          - JOURNAL_ENTRY
          - HABIT
      - description: Id of the item
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Deleted permanently
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid type or id
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such item in the Trash
      summary: Delete an item permanently
      tags:
      - Trash
  /api/v1/trash/{type}/{id}/restore:
    post:
      operationId: restoreTrashItem
      parameters:
      - description: Type of the item
        in: path
        name: type
        required: true
        schema:
          type: string
          enum:
          - TASK
          - PROJECT
          - NOTE
          - EVENT
          - EMAIL
          - FILE
          - FOLDER
          - CONTACT
          - BOOKMARK
          - JOURNAL_ENTRY
          - HABIT
      - description: Id of the item
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Restored
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid type or id
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such item in the Trash
      summary: Restore a deleted item
      tags:
      - Trash
components:
  schemas:
    AreaListResponse:
      type: object
      description: All areas in order
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AreaResponse"
      required:
      - items
    AreaResponse:
      type: object
      description: An area of focus. `version` is also sent as the ETag.
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
        title:
          type: string
        version:
          type: integer
          format: int64
      required:
      - id
      - position
      - title
      - version
    AttendeeDto:
      type: object
      description: An invited person
      properties:
        email:
          type: string
          maxLength: 320
        name:
          type: string
          maxLength: 200
        status:
          type: string
          description: Default NEEDS_ACTION
          enum:
          - NEEDS_ACTION
          - ACCEPTED
          - DECLINED
          - TENTATIVE
          - DELEGATED
      required:
      - email
    BackupJobResponse:
      type: object
      description: A backup job
      properties:
        createdAt:
          type: string
          format: date-time
        fileName:
          type: string
          description: "File name of the zip, once completed"
          example: cockpit-backup-2026-10-20T1530Z.zip
        finishedAt:
          type: string
          format: date-time
          description: When the backup completed or failed
        id:
          type: string
          format: uuid
        size:
          type: integer
          format: int64
          description: "Size of the zip in bytes, once completed"
        state:
          type: string
          enum:
          - RUNNING
          - COMPLETED
          - FAILED
        step:
          type: string
          description: "What the backup is doing, e.g. `gtd: data`"
        stepsDone:
          type: integer
          format: int32
          description: Steps finished
        stepsTotal:
          type: integer
          format: int32
          description: Steps in total
      required:
      - createdAt
      - id
      - state
      - step
      - stepsDone
      - stepsTotal
    CalendarListResponse:
      type: object
      description: "Every calendar, ordered by name"
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CalendarResponse"
      required:
      - items
    CalendarPatchRequest:
      type: object
      description: "Changes to a calendar: only the fields sent change. `isDefault:\
        \ true` makes it the calendar for new events (the previous default loses the\
        \ flag). `color` can be cleared with `null`."
      properties:
        color:
          type:
          - string
          - "null"
          example: "#3366ff"
        isDefault:
          type: boolean
        name:
          type: string
          maxLength: 200
        visible:
          type: boolean
    CalendarResponse:
      type: object
      description: A calendar. `version` is also sent as the ETag.
      properties:
        color:
          type: string
          description: CSS hex color
          example: "#3366ff"
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        isDefault:
          type: boolean
          description: The calendar for new events (at most one)
        name:
          type: string
        readOnly:
          type: boolean
          description: Its events cannot be changed
        sourceId:
          type: string
          format: uuid
        sourceType:
          type: string
          enum:
          - LOCAL
          - GOOGLE
          - MICROSOFT
          - CALDAV
          - ICS_FEED
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
        visible:
          type: boolean
          description: Shown in the calendar views
      required:
      - createdAt
      - id
      - isDefault
      - name
      - readOnly
      - sourceId
      - sourceType
      - updatedAt
      - version
      - visible
    CaptureContextResponse:
      type: object
      description: A context named with `@`
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    CapturePreviewRequest:
      type: object
      description: A text to preview the capture syntax of
      properties:
        text:
          type: string
          maxLength: 100000
          minLength: 0
      required:
      - text
    CapturePreviewResponse:
      type: object
      description: "What a capture of the text creates. Only the title line (the first\
        \ non-blank line) is parsed; the rest of the text is kept as it is. Syntax\
        \ (a token starts the line or follows whitespace): `#project` an existing\
        \ project by title (case-insensitive, `-`/`_` for spaces), `@context` an existing\
        \ context, `!today`, `!tomorrow` or `!YYYY-MM-DD` the due date, `^waiting`\
        \ the WAITING list (`^name`: waiting for name). Recognized tokens are removed\
        \ from the title; unknown ones stay as text."
      properties:
        contexts:
          type: array
          items:
            $ref: "#/components/schemas/CaptureContextResponse"
        dueDate:
          type: string
          format: date
          description: Local date in the user's time zone
        extraNotes:
          type: string
          description: "The rest of the text, put in front of the notes"
        list:
          type: string
          description: "INBOX, or WAITING with a `^` token"
          enum:
          - INBOX
          - NEXT
          - WAITING
          - SOMEDAY
          - SCHEDULED
        project:
          $ref: "#/components/schemas/CaptureProjectResponse"
        title:
          type: string
          description: The task title; empty when the text has none
        waitingFor:
          type: string
          description: Free text of `^name`
      required:
      - contexts
      - list
      - title
    CaptureProjectResponse:
      type: object
      description: A project named with `#`
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
      required:
      - id
      - title
    CaptureRequest:
      type: object
      description: "A quick capture. The first line of `text` becomes the title, further\
        \ lines go in front of `notes`. With `parse` (default true) the capture syntax\
        \ is applied, see `POST /capture/preview`."
      properties:
        fileIds:
          type: array
          description: Uploaded files to link to the task (at most 50)
          items:
            type: string
            format: uuid
          maxItems: 50
          minItems: 0
        id:
          type: string
          format: uuid
          description: Client-generated UUIDv7 for an idempotent capture (offline
            queue)
        notes:
          type: string
          description: Markdown notes of the task
        parse:
          type: boolean
          description: Apply the capture syntax (default true); false keeps the text
            as it is
        text:
          type: string
          maxLength: 100000
          minLength: 0
      required:
      - text
    ChangeEvent:
      type: object
      description: A change notification. Clients refetch the item; the event carries
        no item contents.
      properties:
        at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        op:
          type: string
          enum:
          - CREATED
          - UPDATED
          - DELETED
        type:
          type: string
          description: Item type (an ItemType name such as TASK) or another notification
            kind
          example: TASK
      required:
      - at
      - id
      - op
      - type
    ChecklistItemResponse:
      type: object
      description: A sub-step of a task. `version` is also sent as the ETag.
      properties:
        done:
          type: boolean
        id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
        taskId:
          type: string
          format: uuid
        text:
          type: string
        version:
          type: integer
          format: int64
      required:
      - done
      - id
      - position
      - taskId
      - text
      - version
    ChecklistResponse:
