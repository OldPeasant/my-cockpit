        \ mime type, `inline`, with `Range` support, for the client's own viewer."
      operationId: previewFile
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "Byte range(s) of an inline preview, e.g. `bytes=0-1023`"
        in: header
        name: Range
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
                format: binary
          description: The preview
          headers:
            Content-Disposition:
              description: inline; filename and RFC 6266 filename*
              schema:
                type: string
              style: simple
            X-Preview-Truncated:
              description: "Text only: `true` when the file is longer than 256 KB"
              schema:
                type: boolean
              style: simple
        "206":
          content:
            '*/*':
              schema:
                type: string
                format: binary
          description: The requested range(s) of an inline preview
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found or in the Trash (or, when given, the target folder)"
        "415":
