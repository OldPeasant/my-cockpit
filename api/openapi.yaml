          type: string
          format: password
          maxLength: 256
          minLength: 0
        recoveryCode:
          type: string
          description: "One of the recovery codes, instead of totp"
          example: abcde-fghjk
          maxLength: 64
          minLength: 0
        totp:
          type: string
          description: Current 6-digit code from the authenticator app
          example: 123456
          maxLength: 16
          minLength: 0
        username:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - deviceName
      - password
      - username
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: "Send as `Authorization: Bearer <accessToken>`"
        accessTokenExpiresAt:
          type: string
          format: date-time
        deviceId:
          type: string
          format: uuid
        refreshToken:
          type: string
          description: Opaque; valid for one refresh
        refreshTokenExpiresAt:
          type: string
          format: date-time
        tokenType:
          type: string
          enum:
          - Bearer
      required:
      - accessToken
      - accessTokenExpiresAt
      - deviceId
      - refreshToken
      - refreshTokenExpiresAt
      - tokenType
    TotpEnrollmentResponse:
      type: object
      properties:
        otpauthUri:
          type: string
          description: "otpauth:// URI of the secret, for the QR code"
        totpSecret:
          type: string
          description: "TOTP secret, base32 without padding (HMAC-SHA1, 6 digits,\
            \ 30 s)"
      required:
      - otpauthUri
      - totpSecret
    TrashItemResponse:
      type: object
      properties:
        deletedAt:
          type: string
          format: date-time
        icon:
          type: string
          description: Material Symbols icon name
        id:
          type: string
          format: uuid
        purgeAt:
          type: string
          format: date-time
          description: When the item will be purged automatically
        subtitle:
          type: string
        title:
          type: string
        type:
          type: string
          enum:
          - TASK
          - PROJECT
          - NOTE
          - EVENT
          - EMAIL
          - FILE
          - FOLDER
          - CONTACT
          - BOOKMARK
          - JOURNAL_ENTRY
          - HABIT
      required:
      - deletedAt
      - icon
      - id
      - purgeAt
      - title
      - type
    TrashPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrashItemResponse"
        nextCursor:
          type: string
          description: Cursor of the next page; absent on the last page
      required:
      - items
    UpdateAreaRequest:
      type: object
      description: Changes to an area; fields not sent stay unchanged
      properties:
        position:
          type: integer
          format: int32
        title:
          type: string
          maxLength: 200
    UpdateChecklistItemRequest:
      type: object
      description: Changes to a checklist item; fields not sent stay unchanged
      properties:
        done:
          type: boolean
        position:
          type: integer
          format: int32
        text:
          type: string
          maxLength: 1000
    UpdateMailAccountRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 200
          minLength: 0
        emailAddress:
          type: string
          format: email
        imap:
          $ref: "#/components/schemas/MailServerRequest"
        notifyNewMail:
          type: boolean
        oauthConnectionId:
          type: string
          format: uuid
          description: GOOGLE/MICROSOFT only
        password:
          type: string
          description: "IMAP_SMTP only: replaces the stored password. Write-only"
          writeOnly: true
        signatureMd:
          type: string
          description: Markdown; empty removes the signature
        smtp:
          $ref: "#/components/schemas/MailServerRequest"
        syncWindowMonths:
          type: integer
          format: int32
          maximum: 600
          minimum: 1
        username:
          type: string
    UpdateMailFolderRequest:
      type: object
      properties:
        automatic:
          type: boolean
          description: "true: let detection choose the role again on the next sync"
        role:
          type: string
          description: The role to set by hand; null for no role. Ignored when automatic
            is true
          enum:
          - INBOX
          - SENT
          - DRAFTS
          - TRASH
          - ARCHIVE
          - SPAM
    UploadResponse:
      type: object
      description: "A resumable upload in progress. Send chunk `n` (0-based) with\
        \ exactly `chunkSize` bytes (the last chunk: the rest) to `PUT /uploads/{id}/chunks/{n}`;\
        \ `receivedChunks` tells which arrived, so an interrupted upload resumes with\
        \ the missing ones."
      properties:
        chunkCount:
          type: integer
          format: int32
        chunkSize:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        folderId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        mime:
          type: string
        name:
          type: string
        receivedChunks:
          type: array
          items:
            type: integer
            format: int32
        size:
          type: integer
          format: int64
      required:
      - chunkCount
      - chunkSize
      - createdAt
      - id
      - mime
      - name
      - receivedChunks
      - size
    VCardImportResponse:
      type: object
      description: Result of a vCard import
      properties:
        imported:
          type: array
          description: "The contacts created, in file order"
          items:
            $ref: "#/components/schemas/ContactResponse"
        skipped:
          type: array
          description: Cards that did not become a contact
          items:
            $ref: "#/components/schemas/SkippedVCardDto"
      required:
      - imported
      - skipped
