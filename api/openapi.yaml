openapi: 3.1.0
info:
  title: My Cockpit API
  version: v1
servers:
- url: /
tags:
- description: Web login sessions
  name: Auth
- description: First-run creation of the owner account
  name: Setup
paths:
  /api/v1/auth/login:
    post:
      description: "Sends exactly one of `totp` and `recoveryCode`; a recovery code\
        \ works only once. On success the session cookie is set: persistent for a\
        \ sliding 30 days with `rememberDevice`, a browser-session cookie otherwise.\
        \ After 5 consecutive failures further attempts are blocked for an exponentially\
        \ growing time."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: "Logged in, session cookie set"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing fields, or not exactly one of totp and recoveryCode"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Wrong credentials (does not say which part was wrong)
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many failed attempts; retry after the given number of seconds
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
              style: simple
      summary: Log in with password and a TOTP or recovery code
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Logged out (also when there was no session)
      summary: End the current session and clear its cookie
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: Logged in
        "401":
          description: Not logged in
      summary: The logged-in user
      tags:
      - Auth
  /api/v1/setup:
    post:
      description: "Returns the TOTP secret and recovery codes exactly once. Calling\
        \ it again before the TOTP is confirmed replaces the pending account only\
        \ with the same username and password, or once the pending account is older\
        \ than 1 hour; otherwise it answers 409."
      operationId: startSetup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResponse"
          description: "Account created, TOTP confirmation pending"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid username or password
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Setup is already complete, or another setup is in progress"
      summary: Create the owner account and start the TOTP enrollment
      tags:
      - Setup
  /api/v1/setup/confirm-totp:
    post:
      operationId: confirmSetupTotp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTotpRequest"
        required: true
      responses:
        "204":
          description: "Setup complete, the account is active"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The code is not valid for the TOTP secret
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Setup is already complete, or was not started"
      summary: Activate the account with a code from the authenticator app
      tags:
      - Setup
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"
          description: OK
      summary: Whether the first-run setup still has to be completed
      tags:
      - Setup
components:
  schemas:
    ConfirmTotpRequest:
      type: object
      properties:
        code:
          type: string
          description: Current 6-digit code from the authenticator app
          example: 123456
          minLength: 1
      required:
      - code
    FieldError:
      type: object
      description: A validation error of one request field or parameter.
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
    LoginRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          maxLength: 256
          minLength: 0
        recoveryCode:
          type: string
          description: "One of the recovery codes, instead of totp"
          example: abcde-fghjk
          maxLength: 64
          minLength: 0
        rememberDevice:
          type: boolean
          description: Keep the session for a sliding 30 days instead of the browser
            session
        totp:
          type: string
          description: Current 6-digit code from the authenticator app
          example: 123456
          maxLength: 16
          minLength: 0
        username:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - password
      - username
    MeResponse:
      type: object
      properties:
        username:
          type: string
      required:
      - username
    ProblemDetail:
      type: object
      description: "RFC 9457 Problem Details, the body of every error response."
      properties:
        detail:
          type: string
        errors:
          type: array
          description: "Field errors, only on 400 validation errors."
          items:
            $ref: "#/components/schemas/FieldError"
        instance:
          type: string
          format: uri
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
      required:
      - status
      - title
    SetupRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          maxLength: 256
          minLength: 12
        username:
          type: string
          maxLength: 64
          minLength: 1
          pattern: "[\\p{L}\\p{N}._@-]+"
      required:
      - password
      - username
    SetupResponse:
      type: object
      properties:
        otpauthUri:
          type: string
          description: "otpauth:// URI of the secret, for the QR code"
        recoveryCodes:
          type: array
          description: "10 single-use recovery codes, shown only now"
          items:
            type: string
        totpSecret:
          type: string
          description: "TOTP secret, base32 without padding (HMAC-SHA1, 6 digits,\
            \ 30 s)"
      required:
      - otpauthUri
      - recoveryCodes
      - totpSecret
    SetupStatusResponse:
      type: object
      properties:
        setupRequired:
          type: boolean
      required:
      - setupRequired
