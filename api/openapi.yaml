openapi: 3.1.0
info:
  title: My Cockpit API
  version: v1
servers:
- url: /
tags:
- description: Web login sessions
  name: Auth
- description: User settings
  name: Settings
- description: First-run creation of the owner account
  name: Setup
paths:
  /api/v1/auth/login:
    post:
      description: "Sends exactly one of `totp` and `recoveryCode`; a recovery code\
        \ works only once. On success the session cookie is set: persistent for a\
        \ sliding 30 days with `rememberDevice`, a browser-session cookie otherwise.\
        \ After 5 consecutive failures further attempts are blocked for an exponentially\
        \ growing time."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: "Logged in, session cookie set"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing fields, or not exactly one of totp and recoveryCode"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Wrong credentials (does not say which part was wrong)
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many failed attempts; retry after the given number of seconds
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
              style: simple
      summary: Log in with password and a TOTP or recovery code
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Logged out (also when there was no session)
      summary: End the current session and clear its cookie
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: Logged in
        "401":
          description: Not logged in
      summary: The logged-in user
      tags:
      - Auth
  /api/v1/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
          description: Every registered setting
          headers:
            ETag:
              description: "Version of the settings, for If-Match"
              schema:
                type: string
              style: simple
      summary: "All settings, unset ones with their defaults"
      tags:
      - Settings
    patch:
      description: "Sets the given keys; `null` resets a key to its default, keys\
        \ not sent stay unchanged. Nothing is changed when a key is unknown or a value\
        \ invalid (400, one error per key)."
      operationId: updateSettings
      parameters:
      - description: ETag from the last GET or PATCH
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
          description: Settings changed; all settings with the new ETag
          headers:
            ETag:
              description: New version of the settings
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unknown key or invalid value
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Change settings
      tags:
      - Settings
  /api/v1/setup:
    post:
      description: "Returns the TOTP secret and recovery codes exactly once. Calling\
        \ it again before the TOTP is confirmed replaces the pending account only\
        \ with the same username and password, or once the pending account is older\
        \ than 1 hour; otherwise it answers 409."
      operationId: startSetup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResponse"
          description: "Account created, TOTP confirmation pending"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid username or password
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Setup is already complete, or another setup is in progress"
      summary: Create the owner account and start the TOTP enrollment
      tags:
      - Setup
  /api/v1/setup/confirm-totp:
    post:
      operationId: confirmSetupTotp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTotpRequest"
        required: true
      responses:
        "204":
          description: "Setup complete, the account is active"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The code is not valid for the TOTP secret
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Setup is already complete, or was not started"
      summary: Activate the account with a code from the authenticator app
      tags:
      - Setup
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"
          description: OK
      summary: Whether the first-run setup still has to be completed
      tags:
      - Setup
components:
  schemas:
    ConfirmTotpRequest:
      type: object
      properties:
        code:
          type: string
          description: Current 6-digit code from the authenticator app
          example: 123456
          minLength: 1
      required:
      - code
    FieldError:
      type: object
      description: A validation error of one request field or parameter.
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
    LoginRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          maxLength: 256
          minLength: 0
        recoveryCode:
          type: string
          description: "One of the recovery codes, instead of totp"
          example: abcde-fghjk
          maxLength: 64
          minLength: 0
        rememberDevice:
          type: boolean
          description: Keep the session for a sliding 30 days instead of the browser
            session
        totp:
          type: string
          description: Current 6-digit code from the authenticator app
          example: 123456
          maxLength: 16
          minLength: 0
        username:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - password
      - username
    MeResponse:
      type: object
      properties:
        username:
          type: string
      required:
      - username
    ProblemDetail:
      type: object
      description: "RFC 9457 Problem Details, the body of every error response."
      properties:
        detail:
          type: string
        errors:
          type: array
          description: "Field errors, only on 400 validation errors."
          items:
            $ref: "#/components/schemas/FieldError"
        instance:
          type: string
          format: uri
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
      required:
      - status
      - title
    Settings:
      type: object
      additionalProperties: true
      description: Every setting with its current value; settings registered by other
        modules are additional properties
      properties:
        creativityLabels:
          type: object
          additionalProperties:
            type: string
          description: "Labels of ROUTINE, MIXED, CREATIVE"
        energyLabels:
          type: object
          additionalProperties:
            type: string
          description: "Labels of LOW, MEDIUM, HIGH"
        mailImageAllowedSenders:
          type: array
          description: Senders (addresses or domains) whose remote images are always
            loaded
          items:
            type: string
        mailImagePolicy:
          type: string
          enum:
          - block
          - allow
        theme:
          type: string
          enum:
          - light
          - dark
          - system
        timeZone:
          type: string
          description: IANA time zone
          example: Europe/Zurich
        weekStart:
          type: string
          enum:
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
          - SATURDAY
          - SUNDAY
      required:
      - creativityLabels
      - energyLabels
      - mailImageAllowedSenders
      - mailImagePolicy
      - theme
      - timeZone
      - weekStart
    SettingsPatch:
      type: object
      additionalProperties: true
      description: "The settings to change; null resets a setting to its default,\
        \ absent ones stay unchanged"
      properties:
        creativityLabels:
          type:
          - object
          - "null"
          additionalProperties:
            type: string
          description: "A non-blank label (max. 40 characters) for each of ROUTINE,\
            \ MIXED, CREATIVE"
        energyLabels:
          type:
          - object
          - "null"
          additionalProperties:
            type: string
          description: "A non-blank label (max. 40 characters) for each of LOW, MEDIUM,\
            \ HIGH"
        mailImageAllowedSenders:
          type:
          - array
          - "null"
          description: Distinct sender addresses or domains
          items:
            type: string
        mailImagePolicy:
          type:
          - string
          - "null"
          enum:
          - block
          - allow
          - null
        theme:
          type:
          - string
          - "null"
          enum:
          - light
          - dark
          - system
          - null
        timeZone:
          type:
          - string
          - "null"
          description: IANA time zone
          example: Europe/Zurich
        weekStart:
          type:
          - string
          - "null"
          enum:
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
          - SATURDAY
          - SUNDAY
          - null
    SetupRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          maxLength: 256
          minLength: 12
        username:
          type: string
          maxLength: 64
          minLength: 1
          pattern: "[\\p{L}\\p{N}._@-]+"
      required:
      - password
      - username
    SetupResponse:
      type: object
      properties:
        otpauthUri:
          type: string
          description: "otpauth:// URI of the secret, for the QR code"
        recoveryCodes:
          type: array
          description: "10 single-use recovery codes, shown only now"
          items:
            type: string
        totpSecret:
          type: string
          description: "TOTP secret, base32 without padding (HMAC-SHA1, 6 digits,\
            \ 30 s)"
      required:
      - otpauthUri
      - recoveryCodes
      - totpSecret
    SetupStatusResponse:
      type: object
      properties:
        setupRequired:
          type: boolean
      required:
      - setupRequired
