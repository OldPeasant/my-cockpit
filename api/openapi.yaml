    SetupRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          maxLength: 256
          minLength: 12
        username:
          type: string
          maxLength: 64
          minLength: 1
          pattern: "[\\p{L}\\p{N}._@-]+"
      required:
      - password
      - username
    SetupResponse:
      type: object
      properties:
        otpauthUri:
          type: string
          description: "otpauth:// URI of the secret, for the QR code"
        recoveryCodes:
          type: array
          description: "10 single-use recovery codes, shown only now"
          items:
            type: string
        totpSecret:
          type: string
          description: "TOTP secret, base32 without padding (HMAC-SHA1, 6 digits,\
            \ 30 s)"
      required:
      - otpauthUri
      - recoveryCodes
      - totpSecret
    SetupStatusResponse:
      type: object
      properties:
        setupRequired:
          type: boolean
      required:
      - setupRequired
    TokenRequest:
      type: object
      properties:
        deviceName:
          type: string
          description: Shown in the device list
          example: Pixel 9
          maxLength: 100
          minLength: 0
        password:
          type: string
          format: password
          maxLength: 256
          minLength: 0
        recoveryCode:
          type: string
          description: "One of the recovery codes, instead of totp"
          example: abcde-fghjk
          maxLength: 64
          minLength: 0
        totp:
          type: string
          description: Current 6-digit code from the authenticator app
          example: 123456
          maxLength: 16
          minLength: 0
        username:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - deviceName
      - password
      - username
