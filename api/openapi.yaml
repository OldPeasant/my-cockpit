            schema:
              $ref: "#/components/schemas/MoveTaskRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: The changed task with its new ETag
          headers:
            ETag:
              description: New version of the task
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task, or it is in the Trash"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match was sent and does not match the current ETag
      summary: Move a task to another list (processing)
      tags:
      - Tasks
  /api/v1/tasks/{id}/uncomplete:
    post:
      description: The task returns to the list it was on. `If-Match` is optional.
      operationId: uncompleteTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the task (optional)
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: The changed task with its new ETag
          headers:
            ETag:
              description: New version of the task
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task, or it is in the Trash"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match was sent and does not match the current ETag
      summary: Make a done task open again
