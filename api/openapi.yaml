  /api/v1/links:
    get:
      description: "Each linked item appears once: when several links connect the\
        \ two items (a manual link, inline links in either direction), the manual\
        \ one is returned, else the oldest. Oldest first by the returned link. Each\
        \ end is resolved by its module; an end whose item no longer exists or whose\
        \ type has no resolver yet is returned with `available: false` and only its\
        \ type and id."
      operationId: listLinks
      parameters:
      - description: Type of the item
        in: query
        name: type
        required: true
        schema:
          type: string
          enum:
          - TASK
          - PROJECT
          - NOTE
          - EVENT
          - EMAIL
          - FILE
          - FOLDER
          - CONTACT
          - BOOKMARK
          - JOURNAL_ENTRY
          - HABIT
      - description: Id of the item
        in: query
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkListResponse"
          description: The item's links (empty when it has none or does not exist)
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid type or id
      summary: "The links of an item, in both directions"
      tags:
      - Links
    post:
      description: "The link is shown on both items. Linking an item to itself, to\
        \ an item that does not exist, or a pair that already has a manual link (in\
        \ either direction) is rejected; inline links of the pair do not block it."
      operationId: createLink
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkResponse"
          description: Created; the response is the link as seen from the source
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid request, self-link, or an end that does not exist"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The items already have a manual link
      summary: Link two items
      tags:
      - Links
  /api/v1/links/{id}:
    delete:
      description: "Removes a link with origin `MANUAL` from both items. A link with\
        \ origin `SYNC` (e.g. an inline link in a note) is rejected with 409: the\
        \ next save of its source would recreate it, so it is removed by editing the\
        \ source. Links never change, so no `If-Match` is needed."
      operationId: deleteLink
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such link
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The link has origin `SYNC`; remove it in its source
      summary: Remove a manual link
      tags:
      - Links
  /api/v1/mail/accounts:
    get:
      operationId: listMailAccounts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailAccountListResponse"
          description: The accounts (passwords are never returned)
      summary: "All mail accounts, by display name"
      tags:
      - Mail accounts
    post:
      description: "`IMAP_SMTP` accounts need servers, username and password. `GOOGLE`/`MICROSOFT`\
        \ accounts need `oauthConnectionId` (a connection of that provider, see `/api/v1/oauth`)\
        \ and no password; servers default to the provider's and the username to the\
        \ connection's email address. The servers are not contacted: use `POST /{id}/test`\
        \ and `POST /{id}/folders/sync` afterwards."
      operationId: createMailAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMailAccountRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailAccountResponse"
          description: Created; `Location` points to the account
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid request
      summary: Add a mail account
      tags:
      - Mail accounts
  /api/v1/mail/accounts/{id}:
    delete:
      description: Removes the account with its cached folders and messages. Mail
        on the server is not touched.
      operationId: deleteMailAccount
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: The account's ETag
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such account
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is stale
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Remove a mail account
      tags:
      - Mail accounts
    get:
      operationId: getMailAccount
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailAccountResponse"
          description: "The account, with its version as ETag"
          headers:
            ETag:
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such account
      summary: One mail account
      tags:
      - Mail accounts
    patch:
      description: "Absent (or null) fields stay unchanged; the type cannot change.\
        \ A server is changed as a whole (host, port and security together). `password`\
        \ replaces the stored one; an empty `signatureMd` removes the signature. Changing\
        \ servers or credentials closes the account's open IMAP connections."
      operationId: updateMailAccount
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: The account's ETag
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMailAccountRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailAccountResponse"
          description: "The changed account, with its new ETag"
          headers:
            ETag:
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such account
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is stale
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Change a mail account
      tags:
      - Mail accounts
  /api/v1/mail/accounts/{id}/folders:
    get:
      description: "The folder list of the last sync, by path. Empty before the first\
        \ sync."
      operationId: listMailFolders
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailFolderListResponse"
          description: The folders
        "404":
          content:
