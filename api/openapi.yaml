          type: string
        message:
          type: string
      required:
      - field
      - message
    ItemRefDto:
      type: object
      description: Reference to an item of any type
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - TASK
          - PROJECT
          - NOTE
          - EVENT
          - EMAIL
          - FILE
          - FOLDER
          - CONTACT
          - BOOKMARK
          - JOURNAL_ENTRY
          - HABIT
      required:
      - id
      - type
    LinkEndResponse:
      type: object
      description: "One end of a link. Without `available`, only type and id are set."
      properties:
        available:
          type: boolean
          description: False when the item no longer exists or its type has no resolver
        deepLink:
          type: string
          description: "Client route of the item's detail view, e.g. /tasks/{id}"
        icon:
          type: string
          description: Material Symbols icon name
        id:
          type: string
          format: uuid
        subtitle:
          type: string
        title:
          type: string
        type:
          type: string
          enum:
          - TASK
          - PROJECT
          - NOTE
          - EVENT
          - EMAIL
          - FILE
          - FOLDER
          - CONTACT
          - BOOKMARK
          - JOURNAL_ENTRY
          - HABIT
      required:
      - available
      - id
      - type
    LinkListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LinkResponse"
      required:
      - items
    LinkResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        direction:
          type: string
          description: Direction relative to the queried item
          enum:
          - OUTGOING
          - INCOMING
        id:
          type: string
          format: uuid
        label:
          type: string
        origin:
          type: string
          description: "MANUAL: created via this API, removable with DELETE. SYNC:\
            \ owned by its source (e.g. an inline link in a note), removed by editing\
            \ the source"
          enum:
          - MANUAL
          - SYNC
        source:
          $ref: "#/components/schemas/LinkEndResponse"
        target:
          $ref: "#/components/schemas/LinkEndResponse"
      required:
      - createdAt
      - direction
      - id
      - origin
      - source
      - target
    LoginRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          maxLength: 256
          minLength: 0
        recoveryCode:
          type: string
          description: "One of the recovery codes, instead of totp"
          example: abcde-fghjk
          maxLength: 64
          minLength: 0
        rememberDevice:
          type: boolean
          description: Keep the session for a sliding 30 days instead of the browser
            session
        totp:
          type: string
          description: Current 6-digit code from the authenticator app
          example: 123456
          maxLength: 16
          minLength: 0
        username:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - password
      - username
    MeResponse:
      type: object
      properties:
        username:
          type: string
      required:
      - username
    OAuthConnectionResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        displayName:
          type: string
        email:
          type: string
          description: "The account's email address, if the provider shared it"
        id:
          type: string
          format: uuid
        lastError:
          type: string
          description: "OAuth error code of the last failed token refresh, e.g. invalid_grant"
        lastRefreshedAt:
          type: string
          format: date-time
        provider:
          type: string
          enum:
          - GOOGLE
          - MICROSOFT
        scopes:
          type: array
          description: Granted scopes
          items:
            type: string
        status:
          type: string
          enum:
          - CONNECTED
          - RECONNECT_REQUIRED
        version:
          type: integer
          format: int64
          description: The ETag value for If-Match
      required:
      - createdAt
