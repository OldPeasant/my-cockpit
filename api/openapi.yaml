          format: uuid
      - description: ETag of the item
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChecklistItemRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItemResponse"
          description: Changed; the item with its new ETag
          headers:
            ETag:
              description: New version of the item
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
