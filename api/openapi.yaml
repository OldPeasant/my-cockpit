openapi: 3.1.0
info:
  title: My Cockpit API
  version: v1
servers:
- url: /
tags:
- description: "Connections to Google and Microsoft accounts, shared by calendar,\
    \ mail and contacts"
  name: OAuth
- description: Calendars and their events
  name: Calendars
- description: "Bookmarks and the read-later queue, with title, description and favicon\
    \ from the page"
  name: Bookmarks
- description: Web login sessions and device tokens
  name: Auth
- description: GTD tasks
  name: Tasks
- description: "The drive: folders, files, uploads and downloads"
  name: Files
- description: Create and download backups
  name: Backup
- description: Contacts and their vCard import/export
  name: Contacts
- description: User settings
  name: Settings
- description: "Markdown notes with tags, pins, images and history"
  name: Notes
- description: Quick capture to the Inbox
  name: Capture
- description: First-run creation of the owner account
  name: Setup
- description: "GTD projects, areas of focus and contexts"
  name: Projects
- description: Links between items of any type
  name: Links
- description: "Deleted items: list, restore, delete permanently"
  name: Trash
- description: "Cached message lists (unified Inbox, an account's Inbox or a folder;\
    \ flat or threaded), messages with sanitized HTML and attachments, attachment\
    \ downloads and the remote image proxy. Reading never marks a message as seen.\
    \ Mail server failures are 502 (503 when the account's connections are busy) with\
    \ an `errorCode`."
  name: Mail messages
- description: "Reminders for items of any type. When a reminder is due, the server\
    \ fires it once and sends the SSE event `reminder` on `GET /api/v1/events` with\
    \ a `ReminderResponse` as data. Every change also sends a `change` event of type\
    \ `REMINDER`."
  name: Reminders
- description: Change notifications (Server-Sent Events)
  name: Events
- description: "IMAP/SMTP accounts with password, and Google/Microsoft accounts through\
    \ an OAuth connection (XOAUTH2). Passwords are write-only. Changes send `change`\
    \ events of type `MAIL_ACCOUNT` and `MAIL_FOLDER`."
  name: Mail accounts
- description: Global search across all item types
  name: Search
- description: "Searching cached mail, and on request the mail servers (IMAP SEARCH)"
  name: Mail search
- description: "Habits with checks, streaks and completion stats"
  name: Habits
paths:
  /api/v1/areas:
    get:
      operationId: listAreas
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaListResponse"
          description: The areas
      summary: All areas in order
      tags:
      - Projects
    post:
      operationId: createArea
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAreaRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
          description: Created
          headers:
            ETag:
              description: "Version of the area, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
      summary: Create an area
      tags:
      - Projects
  /api/v1/areas/order:
    put:
      operationId: orderAreas
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaListResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AreaListResponse"
          description: All areas in the new order
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
      summary: Reorder all areas
      tags:
      - Projects
  /api/v1/areas/{id}:
    delete:
      description: Deleted for good (areas have no Trash); its projects no longer
        have an area.
      operationId: deleteArea
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the area
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Deleted
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found (projects: or in the Trash)"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Changed concurrently, or (contexts) the name is taken"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Delete an area
      tags:
      - Projects
    get:
      operationId: getArea
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
          description: The area with its (new) ETag
          headers:
            ETag:
              description: "Version of the area, for If-Match"
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found (projects: or in the Trash)"
      summary: One area
      tags:
      - Projects
    patch:
      description: Only the fields sent change; neither can be cleared. Unknown fields
        are rejected.
      operationId: updateArea
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the area
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAreaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
          description: The area with its (new) ETag
          headers:
            ETag:
              description: "Version of the area, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found (projects: or in the Trash)"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Changed concurrently, or (contexts) the name is taken"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Change an area
      tags:
      - Projects
  /api/v1/auth/devices:
    get:
      operationId: listDevices
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceResponse"
          description: The devices
        "401":
          description: Not logged in
      summary: "Devices logged in with tokens, oldest first"
      tags:
      - Auth
  /api/v1/auth/devices/{id}:
    delete:
      operationId: revokeDevice
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Revoked
        "401":
          description: Not logged in
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such device
      summary: Revoke a device; its tokens stop working immediately
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      description: "Sends exactly one of `totp` and `recoveryCode`; a recovery code\
        \ works only once. On success the session cookie is set: persistent for a\
        \ sliding 30 days with `rememberDevice`, a browser-session cookie otherwise.\
        \ After 5 consecutive failures further attempts are blocked for an exponentially\
        \ growing time. After a restore without the TOTP secret, TOTP codes don't\
        \ work: log in with a recovery code (or with neither when no unused one is\
        \ left); the answer has `totpEnrollmentRequired: true` and the session may\
        \ only set up TOTP again (`/api/v1/auth/totp-enrollment`), everything else\
        \ answers 403."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: "Logged in, session cookie set"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing fields, or both totp and recoveryCode"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Wrong credentials (does not say which part was wrong)
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many failed attempts; retry after the given number of seconds
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
              style: simple
      summary: Log in with password and a TOTP or recovery code
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Logged out (also when there was no session)
      summary: End the current session and clear its cookie
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: Logged in
        "401":
          description: Not logged in
      summary: The logged-in user
      tags:
      - Auth
  /api/v1/auth/recovery-codes:
    post:
      description: "Needs a current TOTP code and shares the login throttle. Returns\
        \ 10 new single-use codes exactly once; all previous codes, used or not, stop\
        \ working."
      operationId: regenerateRecoveryCodes
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateRecoveryCodesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesResponse"
          description: New recovery codes
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid TOTP code
        "401":
          description: Not logged in
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Setup is not complete: there is no active account"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many failed attempts; retry after the given number of seconds
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
              style: simple
      summary: Replace all recovery codes with new ones
      tags:
      - Auth
  /api/v1/auth/token:
    post:
      description: "Takes the same credentials as the web login (exactly one of `totp`\
        \ and `recoveryCode`) plus a device name, and is throttled together with it.\
        \ The access token is valid for 15 minutes, the refresh token until it is\
        \ rotated or 90 days without a refresh. No CSRF token is needed."
      operationId: issueDeviceToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Device registered
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing fields, or not exactly one of totp and recoveryCode"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Wrong credentials (does not say which part was wrong)
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many failed attempts; retry after the given number of seconds
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
              style: simple
      summary: Log a device in and get its access and refresh tokens
      tags:
      - Auth
  /api/v1/auth/token/refresh:
    post:
      description: Returns a new access and refresh token; the refresh token sent
        is no longer valid. Sending a refresh token again after it was rotated revokes
        the device. No CSRF token is needed.
      operationId: refreshDeviceToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: New tokens
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing refresh token
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unknown, expired, already rotated or revoked refresh token"
      summary: Rotate a device's tokens
      tags:
      - Auth
  /api/v1/auth/totp-enrollment:
    post:
      description: Only while the account must enroll TOTP again (`totpEnrollmentRequired`).
        Returns a new TOTP secret; calling it again (from any session) replaces the
        secret. Confirm it with a code from the authenticator app.
      operationId: startTotpEnrollment
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollmentResponse"
          description: The new TOTP secret
        "401":
          description: Not logged in
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: TOTP re-enrollment is not required
      summary: Start setting up TOTP again after a restore
      tags:
      - Auth
  /api/v1/auth/totp-enrollment/confirm:
    post:
      description: "Checks a code for the secret of the last start (from any session);\
        \ shares the login throttle. Afterwards this session has full access, all\
        \ other sessions of the account are ended, and TOTP works for the login again."
      operationId: confirmTotpEnrollment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTotpEnrollmentRequest"
        required: true
      responses:
        "204":
          content:
            application/problem+json:
              schema:
                type: object
          description: "TOTP set up; the account is a normal one again, its other\
            \ sessions are ended"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing code, or not a valid code for the new secret"
        "401":
          description: Not logged in
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: TOTP re-enrollment is not required
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many failed attempts; retry after the given number of seconds
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
              style: simple
      summary: Finish setting up TOTP again
      tags:
      - Auth
  /api/v1/backup:
    post:
      description: "Builds the backup zip in the background. Progress arrives on `GET\
        \ /api/v1/events` as change events of type `BACKUP` with the job's id; refetch\
        \ the job on each. When its state is `COMPLETED`, download the zip. Starting\
        \ a new backup discards earlier finished ones. With a `passphrase`, the secrets\
        \ (TOTP secret, mail passwords, OAuth tokens) are included, encrypted, in\
        \ `data/secrets.enc.json`; without, they are left out. An empty `passphrase`\
        \ counts as none. The body is optional."
      operationId: startBackup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartBackupRequest"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupJobResponse"
          description: Started; `Location` points to the job
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Passphrase too short or too long
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Another backup is running
      summary: Start a backup
      tags:
      - Backup
  /api/v1/backup/{id}:
    get:
      operationId: getBackup
      parameters:
      - description: Id of the backup job
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupJobResponse"
          description: The backup job
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid id
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such backup (unknown, or discarded by a newer one)"
      summary: State and progress of a backup
      tags:
      - Backup
  /api/v1/backup/{id}/download:
    get:
      description: "The zip (format version 1): `README.md`, `manifest.json` (formatVersion,\
        \ appVersion, createdAt, counts, sha256 per file), `data/` (canonical JSON,\
        \ used for restore), `files/` (blobs), `readable/` (mirrors)."
      operationId: downloadBackup
      parameters:
      - description: Id of the backup job
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/zip:
              schema:
                type: string
                format: binary
          description: The backup zip
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid id
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such backup
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The backup is still running or failed
      summary: Download a completed backup
      tags:
      - Backup
  /api/v1/bookmarks:
    get:
      description: "Bookmarks matching every given filter, not in the Trash, newest\
        \ first. The read-later queue is `readLater=true&read=false`."
      operationId: listBookmarks
      parameters:
      - description: Only bookmarks with this tag (regardless of case)
        in: query
        name: tag
        required: false
        schema:
          type: string
      - description: "true: only bookmarks in the read-later list, false: only those\
          \ that are not"
        in: query
        name: readLater
        required: false
        schema:
          type: boolean
      - description: "true: only read bookmarks, false: only unread ones"
        in: query
        name: read
        required: false
        schema:
          type: boolean
      - description: Cursor from the previous page
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: "Page size, 1-200 (default 50)"
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkPageResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/BookmarkPageResponse"
          description: One page of bookmarks
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
      summary: List bookmarks
      tags:
      - Bookmarks
    post:
      description: "Saves the URL and fetches the page in the background (`metadataStatus`\
        \ PENDING): its title, description and favicon fill the fields left empty."
      operationId: createBookmark
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookmarkRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkResponse"
          description: Created
          headers:
            ETag:
              description: "Version of the bookmark, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
      summary: Create a bookmark
      tags:
      - Bookmarks
  /api/v1/bookmarks/tags:
    get:
      operationId: listBookmarkTags
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkTagListResponse"
          description: The tags
      summary: "Every bookmark tag in use, with its number of bookmarks"
      tags:
      - Bookmarks
  /api/v1/bookmarks/{id}:
    delete:
      operationId: deleteBookmark
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the bookmark
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "204":
          description: In the Trash
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Not found or in the Trash
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Move a bookmark to the Trash
      tags:
      - Bookmarks
    get:
      operationId: getBookmark
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkResponse"
          description: The bookmark with its (new) ETag
          headers:
            ETag:
              description: "Version of the bookmark, for If-Match"
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Not found or in the Trash
      summary: One bookmark
      tags:
      - Bookmarks
    patch:
      description: Only the fields sent change; `null` clears the title or description.
        `read` marks it as read or unread. A new URL clears the favicon and fetches
        the page metadata again (filling empty fields).
      operationId: updateBookmark
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the bookmark
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookmarkPatchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkResponse"
          description: The bookmark with its (new) ETag
          headers:
            ETag:
