openapi: 3.1.0
info:
  title: My Cockpit API
  version: v1
servers:
- url: /
tags:
- description: "Connections to Google and Microsoft accounts, shared by calendar,\
    \ mail and contacts"
  name: OAuth
- description: Change notifications (Server-Sent Events)
  name: Events
- description: Web login sessions and device tokens
  name: Auth
- description: Global search across all item types
  name: Search
- description: User settings
  name: Settings
- description: First-run creation of the owner account
  name: Setup
- description: Links between items of any type
  name: Links
- description: "Deleted items: list, restore, delete permanently"
  name: Trash
paths:
  /api/v1/auth/devices:
    get:
      operationId: listDevices
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceResponse"
          description: The devices
        "401":
          description: Not logged in
      summary: "Devices logged in with tokens, oldest first"
      tags:
      - Auth
  /api/v1/auth/devices/{id}:
    delete:
      operationId: revokeDevice
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Revoked
        "401":
          description: Not logged in
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such device
      summary: Revoke a device; its tokens stop working immediately
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      description: "Sends exactly one of `totp` and `recoveryCode`; a recovery code\
        \ works only once. On success the session cookie is set: persistent for a\
        \ sliding 30 days with `rememberDevice`, a browser-session cookie otherwise.\
        \ After 5 consecutive failures further attempts are blocked for an exponentially\
        \ growing time."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: "Logged in, session cookie set"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing fields, or not exactly one of totp and recoveryCode"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Wrong credentials (does not say which part was wrong)
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many failed attempts; retry after the given number of seconds
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
              style: simple
      summary: Log in with password and a TOTP or recovery code
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Logged out (also when there was no session)
      summary: End the current session and clear its cookie
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: Logged in
        "401":
          description: Not logged in
      summary: The logged-in user
      tags:
      - Auth
  /api/v1/auth/token:
    post:
      description: "Takes the same credentials as the web login (exactly one of `totp`\
        \ and `recoveryCode`) plus a device name, and is throttled together with it.\
        \ The access token is valid for 15 minutes, the refresh token until it is\
        \ rotated or 90 days without a refresh. No CSRF token is needed."
      operationId: issueDeviceToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Device registered
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing fields, or not exactly one of totp and recoveryCode"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Wrong credentials (does not say which part was wrong)
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many failed attempts; retry after the given number of seconds
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
              style: simple
      summary: Log a device in and get its access and refresh tokens
      tags:
      - Auth
  /api/v1/auth/token/refresh:
    post:
      description: Returns a new access and refresh token; the refresh token sent
        is no longer valid. Sending a refresh token again after it was rotated revokes
        the device. No CSRF token is needed.
      operationId: refreshDeviceToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: New tokens
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing refresh token
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unknown, expired, already rotated or revoked refresh token"
      summary: Rotate a device's tokens
      tags:
      - Auth
  /api/v1/events:
    get:
      description: "A Server-Sent Events stream. Each committed change arrives as\
        \ an event named `change` whose data is a `ChangeEvent` JSON object; clients\
        \ refetch the item. Comment lines (`:heartbeat`) arrive every 25 seconds and\
        \ carry no data. Events are not replayed: after a reconnect, clients refetch\
        \ what they show. The server ends each stream after 15 minutes; clients reconnect\
        \ (EventSource does so automatically), which checks the login again."
      operationId: streamEvents
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChangeEvent"
          description: The event stream; each event's data is a ChangeEvent
        "401":
          description: Not logged in
      summary: Stream change notifications
      tags:
      - Events
  /api/v1/links:
    get:
      description: "Each linked item appears once: when several links connect the\
        \ two items (a manual link, inline links in either direction), the manual\
        \ one is returned, else the oldest. Oldest first by the returned link. Each\
        \ end is resolved by its module; an end whose item no longer exists or whose\
        \ type has no resolver yet is returned with `available: false` and only its\
        \ type and id."
      operationId: listLinks
      parameters:
      - description: Type of the item
        in: query
        name: type
        required: true
        schema:
          type: string
          enum:
          - TASK
          - PROJECT
          - NOTE
          - EVENT
          - EMAIL
          - FILE
          - FOLDER
          - CONTACT
          - BOOKMARK
          - JOURNAL_ENTRY
          - HABIT
      - description: Id of the item
        in: query
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkListResponse"
          description: The item's links (empty when it has none or does not exist)
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid type or id
      summary: "The links of an item, in both directions"
      tags:
      - Links
    post:
      description: "The link is shown on both items. Linking an item to itself, to\
        \ an item that does not exist, or a pair that already has a manual link (in\
        \ either direction) is rejected; inline links of the pair do not block it."
      operationId: createLink
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkResponse"
          description: Created; the response is the link as seen from the source
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid request, self-link, or an end that does not exist"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The items already have a manual link
      summary: Link two items
      tags:
      - Links
  /api/v1/links/{id}:
    delete:
      description: "Removes a link with origin `MANUAL` from both items. A link with\
        \ origin `SYNC` (e.g. an inline link in a note) is rejected with 409: the\
        \ next save of its source would recreate it, so it is removed by editing the\
        \ source. Links never change, so no `If-Match` is needed."
      operationId: deleteLink
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such link
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The link has origin `SYNC`; remove it in its source
      summary: Remove a manual link
      tags:
      - Links
  /api/v1/oauth/connections:
    get:
      operationId: listOAuthConnections
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OAuthConnectionResponse"
          description: All connections (tokens are never returned)
      summary: "The connected accounts with their status, oldest first"
      tags:
      - OAuth
  /api/v1/oauth/connections/{id}:
    delete:
      description: "Removes the connection and its tokens, and revokes the refresh\
        \ token at Google (Microsoft has no revocation endpoint: remove the app under\
        \ the account's privacy settings). Calendar sources and mail accounts using\
        \ the connection stop syncing."
      operationId: disconnectOAuthConnection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: The connection's ETag
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Disconnected
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such connection
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is stale
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Disconnect an account
      tags:
      - OAuth
    get:
      operationId: getOAuthConnection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthConnectionResponse"
          description: "The connection, with its version as ETag"
          headers:
            ETag:
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such connection
      summary: One connection
      tags:
      - OAuth
  /api/v1/oauth/providers:
    get:
      operationId: listOAuthProviders
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OAuthProviderResponse"
          description: Both providers
      summary: The providers and whether their OAuth app is configured
      tags:
      - OAuth
  /api/v1/oauth/{provider}/callback:
    get:
      description: "Accepts only the state of a pending flow of the same browser session,\
        \ exchanges the code and stores the encrypted refresh token. Redirects to\
        \ `/settings/integrations` with `oauth=connected&provider=&purpose=&connectionId=`\
        \ or `oauth=error&provider=&error=` (`invalid_state`, `access_denied`, `token_exchange_failed`,\
        \ `no_refresh_token`) and, when known, `purpose=`."
      operationId: completeOAuthConnection
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
          enum:
          - google
          - microsoft
      - in: query
        name: code
        required: false
        schema:
          type: string
      - in: query
        name: state
        required: false
        schema:
          type: string
      - in: query
        name: error
        required: false
        schema:
          type: string
      responses:
        "302":
          description: Redirect to the SPA
          headers:
            Location:
              description: The SPA page showing the outcome
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unknown provider
      summary: The provider's redirect back (browser navigation)
      tags:
      - OAuth
  /api/v1/oauth/{provider}/start:
    get:
      description: "Redirects to the provider's consent screen (authorization code\
        \ flow with PKCE) asking for the combined calendar, mail and contacts scopes.\
        \ The flow is bound to the current browser session and expires after 10 minutes.\
        \ Connecting an account that is already connected updates that connection."
      operationId: startOAuthConnection
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
          enum:
          - google
          - microsoft
      - description: What the account is connected for; passed back to the SPA after
          the callback
        in: query
        name: purpose
        required: true
        schema:
          type: string
          enum:
          - CALENDAR
          - MAIL
          - CONTACTS
      responses:
        "302":
          content:
            '*/*':
              schema:
                type: object
          description: Redirect to the provider
          headers:
            Location:
              description: The provider's authorization URL
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or unknown purpose
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No browser session
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unknown provider
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The provider's OAuth app is not configured on this server
      summary: Start connecting a provider account (browser navigation)
      tags:
      - OAuth
  /api/v1/search:
    get:
      description: "Every word of `q` must match the start of a word of an item's\
        \ title or text (exact or English-stemmed form); hits rank by relevance (title\
        \ before text) and recency. When that finds fewer than `limit` items, items\
        \ whose title is similar to `q` (typos, fragments) fill up the rest. Results\
        \ are grouped by type, groups ordered by their best hit; `limit` counts items\
        \ across all groups. Items in the Trash are not found. A query without letters\
        \ or digits finds nothing."
      operationId: search
      parameters:
      - description: Search text
        in: query
        name: q
        required: true
        schema:
          type: string
          maxLength: 200
          minLength: 1
      - description: Only these item types (comma-separated or repeated); all types
          when absent
        in: query
        name: types
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - TASK
            - PROJECT
            - NOTE
            - EVENT
            - EMAIL
            - FILE
            - FOLDER
            - CONTACT
            - BOOKMARK
            - JOURNAL_ENTRY
            - HABIT
      - description: "Maximum number of items, 1..50"
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 50
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
          description: "The matching items, grouped by type"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Blank or too long `q`, unknown type, or `limit` out of range"
      summary: Search all items
      tags:
      - Search
  /api/v1/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
          description: Every registered setting
          headers:
            ETag:
              description: "Version of the settings, for If-Match"
              schema:
                type: string
              style: simple
      summary: "All settings, unset ones with their defaults"
      tags:
      - Settings
    patch:
      description: "Sets the given keys; `null` resets a key to its default, keys\
        \ not sent stay unchanged. Nothing is changed when a key is unknown or a value\
        \ invalid (400, one error per key)."
      operationId: updateSettings
      parameters:
      - description: ETag from the last GET or PATCH
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
          description: Settings changed; all settings with the new ETag
          headers:
            ETag:
              description: New version of the settings
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unknown key or invalid value
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Change settings
      tags:
      - Settings
  /api/v1/setup:
    post:
      description: "Returns the TOTP secret and recovery codes exactly once. Calling\
        \ it again before the TOTP is confirmed replaces the pending account only\
        \ with the same username and password, or once the pending account is older\
        \ than 1 hour; otherwise it answers 409."
      operationId: startSetup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResponse"
          description: "Account created, TOTP confirmation pending"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid username or password
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Setup is already complete, or another setup is in progress"
      summary: Create the owner account and start the TOTP enrollment
      tags:
      - Setup
  /api/v1/setup/confirm-totp:
    post:
      operationId: confirmSetupTotp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTotpRequest"
        required: true
      responses:
        "204":
          description: "Setup complete, the account is active"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The code is not valid for the TOTP secret
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Setup is already complete, or was not started"
      summary: Activate the account with a code from the authenticator app
      tags:
      - Setup
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"
          description: OK
      summary: Whether the first-run setup still has to be completed
      tags:
      - Setup
  /api/v1/trash:
    get:
      description: "Most recently deleted first (ties by type, then id). Items are\
        \ purged automatically at `purgeAt`, 30 days after their deletion."
      operationId: listTrash
      parameters:
      - description: Opaque cursor from the previous page's `nextCursor`
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: "Page size, 1..200 (default 50)"
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashPageResponse"
          description: One page of the Trash
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid cursor or limit
      summary: Deleted items of all types
      tags:
      - Trash
  /api/v1/trash/{type}/{id}:
    delete:
      description: Only items in the Trash can be deleted permanently; their links
        are removed as well.
      operationId: purgeTrashItem
      parameters:
      - description: Type of the item
        in: path
        name: type
        required: true
        schema:
          type: string
          enum:
          - TASK
          - PROJECT
          - NOTE
          - EVENT
          - EMAIL
          - FILE
          - FOLDER
          - CONTACT
          - BOOKMARK
          - JOURNAL_ENTRY
          - HABIT
      - description: Id of the item
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Deleted permanently
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid type or id
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such item in the Trash
      summary: Delete an item permanently
      tags:
      - Trash
  /api/v1/trash/{type}/{id}/restore:
    post:
      operationId: restoreTrashItem
      parameters:
      - description: Type of the item
        in: path
        name: type
        required: true
        schema:
          type: string
          enum:
          - TASK
          - PROJECT
          - NOTE
          - EVENT
          - EMAIL
          - FILE
          - FOLDER
          - CONTACT
          - BOOKMARK
          - JOURNAL_ENTRY
          - HABIT
      - description: Id of the item
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Restored
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid type or id
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such item in the Trash
      summary: Restore a deleted item
      tags:
      - Trash
components:
  schemas:
    ChangeEvent:
      type: object
      description: A change notification. Clients refetch the item; the event carries
        no item contents.
      properties:
        at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        op:
          type: string
          enum:
          - CREATED
          - UPDATED
          - DELETED
        type:
          type: string
          description: Item type (an ItemType name such as TASK) or another notification
            kind
          example: TASK
      required:
      - at
      - id
      - op
      - type
    ConfirmTotpRequest:
      type: object
      properties:
        code:
          type: string
          description: Current 6-digit code from the authenticator app
          example: 123456
          minLength: 1
      required:
      - code
    CreateLinkRequest:
      type: object
      properties:
        label:
          type: string
          description: "Optional short label, e.g. \"origin\""
          maxLength: 200
          minLength: 0
        source:
          $ref: "#/components/schemas/ItemRefDto"
        target:
          $ref: "#/components/schemas/ItemRefDto"
      required:
      - source
      - target
    DeviceResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        lastSeenAt:
          type: string
          format: date-time
