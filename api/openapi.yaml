      properties:
        areaId:
          type: string
          format: uuid
        descriptionMd:
          type: string
        dueDate:
          type: string
          format: date
        reviewDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - ACTIVE
          - ON_HOLD
          - SOMEDAY
          - COMPLETED
          - DROPPED
        title:
          type: string
          maxLength: 500
      required:
      - title
    CreateReminderRequest:
      type: object
      properties:
        channel:
          type: string
          description: Defaults to NOTIFICATION
          enum:
          - NOTIFICATION
        itemId:
          type: string
          format: uuid
        itemType:
          type: string
          enum:
          - TASK
          - PROJECT
          - NOTE
          - EVENT
          - EMAIL
          - FILE
          - FOLDER
          - CONTACT
          - BOOKMARK
          - JOURNAL_ENTRY
          - HABIT
        remindAt:
          type: string
          format: date-time
          description: When to remind (ISO-8601 instant)
      required:
      - itemId
      - itemType
      - remindAt
    CreateTaskRequest:
      type: object
      description: A new task. Only `title` is required; it goes to the Inbox unless
        `list` says otherwise.
      properties:
        contextIds:
          type: array
          items:
            type: string
            format: uuid
        creativity:
          type: string
          enum:
          - ROUTINE
          - MIXED
          - CREATIVE
        dueDate:
          type: string
          format: date
        dueTime:
          type: string
          format: time
          description: Only together with `dueDate`
          example: 14:30:00
        energy:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        id:
          type: string
          format: uuid
          description: Client-generated UUIDv7 for an idempotent create (offline capture)
        list:
          type: string
          description: "Default INBOX; SCHEDULED needs `scheduledDate` (only allowed\
            \ there), WAITING sets `waitingSince` to today (the waiting-for fields\
            \ and `waitingSince` are only allowed there)"
          enum:
          - INBOX
          - NEXT
          - WAITING
          - SOMEDAY
          - SCHEDULED
        notesMd:
          type: string
        position:
          type: integer
          format: int32
          description: "Default: the end of its list or project"
        projectId:
          type: string
          format: uuid
        recurrenceMode:
          type: string
          enum:
          - FIXED
          - AFTER_COMPLETION
        recurrenceRule:
          type: string
        scheduledDate:
          type: string
          format: date
        timeEstimateMin:
          type: integer
          format: int32
          maximum: 10000
          minimum: 0
        title:
          type: string
          maxLength: 500
        waitingForContactId:
          type: string
          format: uuid
        waitingForText:
          type: string
        waitingSince:
          type: string
          format: date
      required:
      - title
    CreateUploadRequest:
      type: object
      description: A new resumable upload
      properties:
        folderId:
          type:
          - string
          - "null"
          format: uuid
          description: "Target folder; omitted or `null`: the drive root"
        mime:
          type: string
          description: Mime type; default `application/octet-stream`
        name:
          type: string
          description: Name of the file
          maxLength: 255
        size:
          type: integer
          format: int64
          description: Size of the whole file in bytes
      required:
      - name
      - size
    DeviceResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        lastSeenAt:
          type: string
          format: date-time
          description: Last login or token refresh
        name:
          type: string
      required:
      - createdAt
      - id
      - lastSeenAt
      - name
    DriveEntryResponse:
      type: object
      description: "An entry of a folder listing: a folder (`folder` set) or a file\
        \ (`file` set)."
      properties:
        file:
          $ref: "#/components/schemas/FileResponse"
        folder:
          $ref: "#/components/schemas/FolderSummary"
        type:
          type: string
          enum:
          - FOLDER
          - FILE
      required:
      - type
    DrivePageResponse:
      type: object
      description: "One page of a folder's contents: folders first, then files, each\
        \ by name (regardless of case)."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DriveEntryResponse"
        nextCursor:
          type: string
          description: Cursor of the next page; `null` on the last page
      required:
      - items
    DriveUsageResponse:
      type: object
      description: Disk usage of the drive
      properties:
        fileCount:
          type: integer
          format: int64
        folderCount:
          type: integer
          format: int64
        maxFileSize:
          type: integer
          format: int64
          description: Largest file the drive accepts
        totalSpaceBytes:
          type: integer
          format: int64
          description: Size of the disk that holds the files
        trashBytes:
          type: integer
          format: int64
          description: Bytes of the files in the Trash
        trashFileCount:
          type: integer
          format: int64
        usableSpaceBytes:
          type: integer
          format: int64
          description: Free space on that disk
        usedBytes:
          type: integer
          format: int64
          description: Bytes of the files not in the Trash
      required:
      - fileCount
      - folderCount
      - maxFileSize
      - totalSpaceBytes
      - trashBytes
      - trashFileCount
      - usableSpaceBytes
      - usedBytes
    EventPatchRequest:
      type: object
      description: "Changes to an event: only the fields sent change, `null` clears\
        \ a field (`title` cannot be cleared). Time fields not sent keep their value,\
        \ the duration is kept when only `start` (or `startDate`) changes. With `scope=THIS|FOLLOWING`,\
        \ or `scope=ALL` with an `occurrence`, the time fields are the new times of\
        \ that occurrence. `rrule` and `calendarId` cannot change for a single occurrence\
        \ (`scope=THIS`)."
      properties:
        allDay:
          type: boolean
        attendees:
          type: array
          description: Replaces the attendees
          items:
            $ref: "#/components/schemas/AttendeeDto"
        calendarId:
          type: string
          format: uuid
        conferenceUrl:
          type:
          - string
          - "null"
        description:
          type:
          - string
          - "null"
        end:
          type: string
          format: date-time
        endDate:
          type: string
          format: date
        location:
          type:
          - string
          - "null"
        reminderMinutes:
          type: array
          description: Replaces the reminders
          items:
            type: integer
            format: int32
        rrule:
          type:
          - string
          - "null"
          description: '`null` makes a series a single event'
        start:
          type: string
          format: date-time
        startDate:
          type: string
          format: date
        status:
          type: string
          description: CANCELLED on an occurrence removes it
          enum:
          - CONFIRMED
          - TENTATIVE
          - CANCELLED
        timeZone:
          type: string
        title:
          type: string
          maxLength: 500
        transparency:
          type: string
          enum:
          - OPAQUE
          - TRANSPARENT
    EventResponse:
      type: object
      description: "An event, a series master (`rrule` set) or the override of one\
        \ occurrence of a series (`seriesId` and `recurrenceId` set). Timed events\
        \ have `start`/`end` and `timeZone`, all-day events `startDate` and the exclusive\
        \ `endDate`. `version` is also sent as the ETag."
      properties:
        allDay:
          type: boolean
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/AttendeeDto"
        calendarId:
          type: string
          format: uuid
        conferenceUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        description:
          type: string
        end:
          type: string
          format: date-time
        endDate:
          type: string
          format: date
          description: "Exclusive: a one-day event on the 3rd ends on the 4th"
        exdates:
          type: array
          description: "Excluded occurrences (original starts: instants, or dates\
            \ for all-day series)"
          items:
            type: string
        id:
          type: string
          format: uuid
        location:
          type: string
        recurrenceId:
          type: string
          description: The original start of the occurrence an override replaces
        reminderMinutes:
          type: array
          description: Minutes before the start of each reminder
          items:
            type: integer
            format: int32
        rrule:
          type: string
          description: iCalendar RRULE without the `RRULE:` prefix (series masters)
          example: FREQ=WEEKLY;BYDAY=MO
        seriesId:
          type: string
          format: uuid
          description: The series master of an override
        start:
          type: string
          format: date-time
        startDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - CONFIRMED
          - TENTATIVE
          - CANCELLED
        syncState:
          type: string
          enum:
          - LOCAL
          - SYNCED
          - PENDING
          - ERROR
        timeZone:
          type: string
          description: IANA zone id the timed event was planned in
          example: Europe/Zurich
        title:
          type: string
        transparency:
          type: string
          enum:
          - OPAQUE
          - TRANSPARENT
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
      required:
      - allDay
      - attendees
      - calendarId
      - createdAt
      - exdates
      - id
      - reminderMinutes
      - status
      - syncState
      - title
      - transparency
      - updatedAt
      - version
    FieldError:
      type: object
      description: A validation error of one request field or parameter.
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
    FilePatchRequest:
      type: object
      description: "Changes of a file: only the fields sent change. `folderId: null`\
        \ moves it to the drive root."
      properties:
        folderId:
          type:
          - string
          - "null"
          format: uuid
