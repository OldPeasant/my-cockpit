      properties:
        name:
          type: string
          description: Shown name; defaults to the URL's host or the account's email
        oauthConnectionId:
          type: string
          format: uuid
          description: "GOOGLE/MICROSOFT: the OAuth connection"
        password:
          type: string
          format: password
          description: "CALDAV: the (app) password"
        type:
          type: string
          description: "CALDAV, ICS_FEED, GOOGLE or MICROSOFT"
          enum:
          - LOCAL
          - GOOGLE
          - MICROSOFT
          - CALDAV
          - ICS_FEED
        url:
          type: string
          description: "CALDAV: the server or calendar home URL; ICS_FEED: the feed\
            \ URL"
        username:
          type: string
          description: "CALDAV: the user name"
      required:
      - type
    CreateChecklistItemRequest:
      type: object
      description: "A new checklist item, added at the end"
      properties:
        done:
          type: boolean
        text:
          type: string
          maxLength: 1000
      required:
      - text
    CreateContextRequest:
      type: object
      description: A new context. Names are trimmed and unique regardless of case.
      properties:
        color:
          type: string
          description: Hex color (`#rgb` or `#rrggbb`)
          example: "#3366ff"
        name:
          type: string
          example: '@home'
          maxLength: 100
        position:
          type: integer
          format: int32
          description: "Default: at the end"
      required:
      - name
    CreateEventRequest:
      type: object
      description: "A new event. Timed: `start`, `end` (default `start` + 1 hour)\
        \ and `timeZone` (default the user's); all-day (`allDay: true`): `startDate`\
        \ and the exclusive `endDate` (default the day after). `calendarId` defaults\
        \ to the default calendar."
      properties:
        allDay:
          type: boolean
          description: Default false
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/AttendeeDto"
        calendarId:
          type: string
          format: uuid
        conferenceUrl:
          type: string
        description:
          type: string
        end:
          type: string
          format: date-time
        endDate:
          type: string
          format: date
        id:
          type: string
          format: uuid
          description: Client-generated UUIDv7 for an idempotent create
        location:
          type: string
        reminderMinutes:
          type: array
          items:
            type: integer
            format: int32
        rrule:
          type: string
          description: iCalendar RRULE (the `RRULE:` prefix is optional)
          example: FREQ=WEEKLY;BYDAY=MO
        start:
          type: string
          format: date-time
        startDate:
          type: string
          format: date
        status:
          type: string
          description: Default CONFIRMED
          enum:
          - CONFIRMED
          - TENTATIVE
          - CANCELLED
        timeZone:
          type: string
          example: Europe/Zurich
        title:
          type: string
          maxLength: 500
        transparency:
          type: string
          description: Default OPAQUE
          enum:
          - OPAQUE
          - TRANSPARENT
      required:
      - title
    CreateFolderRequest:
      type: object
      description: A new folder
      properties:
        name:
          type: string
          maxLength: 255
        parentId:
          type:
          - string
          - "null"
          format: uuid
          description: "The parent folder; omitted or `null`: the drive root"
      required:
      - name
    CreateLinkRequest:
      type: object
      properties:
        label:
          type: string
          description: "Optional short label, e.g. \"origin\""
          maxLength: 200
          minLength: 0
        source:
          $ref: "#/components/schemas/ItemRefDto"
        target:
          $ref: "#/components/schemas/ItemRefDto"
      required:
      - source
      - target
    CreateMailAccountRequest:
      type: object
      properties:
        displayName:
          type: string
          description: Defaults to the email address
          maxLength: 200
          minLength: 0
        emailAddress:
          type: string
          format: email
          minLength: 1
        imap:
          $ref: "#/components/schemas/MailServerRequest"
          description: Required for IMAP_SMTP; defaults to the provider's server for
            GOOGLE/MICROSOFT
        notifyNewMail:
          type: boolean
          description: Notify about new mail in the Inbox; defaults to true
        oauthConnectionId:
          type: string
          format: uuid
          description: "GOOGLE/MICROSOFT only: the OAuth connection to log in with"
        password:
          type: string
          description: "IMAP_SMTP only: password or app password. Write-only"
          writeOnly: true
        signatureMd:
          type: string
          description: Markdown
        smtp:
          $ref: "#/components/schemas/MailServerRequest"
          description: Required for IMAP_SMTP; defaults to the provider's server for
            GOOGLE/MICROSOFT
        syncWindowMonths:
          type: integer
          format: int32
          description: Months of headers cached on the first sync; defaults to 12
          maximum: 600
          minimum: 1
        type:
          type: string
          enum:
          - IMAP_SMTP
          - GOOGLE
          - MICROSOFT
        username:
          type: string
          description: Required for IMAP_SMTP; defaults to the connection's email
            for GOOGLE/MICROSOFT
      required:
      - emailAddress
      - type
    CreateNoteRequest:
      type: object
      description: A new note. Every field is optional.
      properties:
        archived:
          type: boolean
        bodyMd:
          type: string
          description: Markdown (default empty)
          maxLength: 100000
        pinned:
          type: boolean
        tags:
          type: array
          description: "Trimmed, a leading `#` removed, each once regardless of case\
            \ (at most 50, 50 characters each)"
          items:
            type: string
        title:
          type: string
          description: "Empty or omitted: derived from the first line of the body"
          maxLength: 500
    CreateProjectRequest:
      type: object
      description: A new project. Only `title` is required; the status defaults to
