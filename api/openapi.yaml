        \ its name. Supports `Range` (`206 Partial Content`, `416` for an unsatisfiable\
        \ range)."
      operationId: downloadFile
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "Byte range(s), e.g. `bytes=0-1023`"
        in: header
        name: Range
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
                format: binary
          description: The contents
          headers:
            Accept-Ranges:
              description: bytes
              schema:
                type: string
              style: simple
            Content-Disposition:
              description: attachment; filename and RFC 6266 filename*
              schema:
                type: string
              style: simple
        "206":
          content:
            '*/*':
              schema:
                type: string
                format: binary
          description: The requested range(s)
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found or in the Trash (or, when given, the target folder)"
