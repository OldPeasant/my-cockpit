                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing, blank or too long text"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task, or it is in the Trash"
      summary: Add a checklist item at the end
