    EventPatchRequest:
      type: object
      description: "Changes to an event: only the fields sent change, `null` clears\
        \ a field (`title` cannot be cleared). Time fields not sent keep their value,\
        \ the duration is kept when only `start` (or `startDate`) changes. With `scope=THIS|FOLLOWING`,\
        \ or `scope=ALL` with an `occurrence`, the time fields are the new times of\
        \ that occurrence. `rrule` and `calendarId` cannot change for a single occurrence\
        \ (`scope=THIS`)."
      properties:
        allDay:
          type: boolean
        attendees:
          type: array
          description: Replaces the attendees
          items:
            $ref: "#/components/schemas/AttendeeDto"
        calendarId:
          type: string
          format: uuid
        conferenceUrl:
          type:
          - string
          - "null"
        description:
          type:
          - string
          - "null"
        end:
          type: string
          format: date-time
        endDate:
          type: string
          format: date
        location:
          type:
          - string
          - "null"
        reminderMinutes:
          type: array
          description: Replaces the reminders
          items:
            type: integer
            format: int32
        rrule:
          type:
          - string
          - "null"
          description: '`null` makes a series a single event'
        start:
          type: string
          format: date-time
        startDate:
          type: string
          format: date
        status:
          type: string
          description: CANCELLED on an occurrence removes it
          enum:
          - CONFIRMED
          - TENTATIVE
          - CANCELLED
        timeZone:
          type: string
        title:
          type: string
          maxLength: 500
        transparency:
          type: string
          enum:
          - OPAQUE
          - TRANSPARENT
    EventResponse:
      type: object
      description: "An event, a series master (`rrule` set) or the override of one\
        \ occurrence of a series (`seriesId` and `recurrenceId` set). Timed events\
        \ have `start`/`end` and `timeZone`, all-day events `startDate` and the exclusive\
        \ `endDate`. `version` is also sent as the ETag."
      properties:
        allDay:
          type: boolean
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/AttendeeDto"
        calendarId:
          type: string
          format: uuid
        conferenceUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        description:
          type: string
        end:
          type: string
          format: date-time
        endDate:
          type: string
          format: date
          description: "Exclusive: a one-day event on the 3rd ends on the 4th"
        exdates:
          type: array
          description: "Excluded occurrences (original starts: instants, or dates\
            \ for all-day series)"
          items:
            type: string
        id:
          type: string
          format: uuid
        location:
          type: string
        recurrenceId:
          type: string
          description: The original start of the occurrence an override replaces
        reminderMinutes:
          type: array
          description: Minutes before the start of each reminder
          items:
            type: integer
            format: int32
        rrule:
          type: string
          description: iCalendar RRULE without the `RRULE:` prefix (series masters)
          example: FREQ=WEEKLY;BYDAY=MO
        seriesId:
          type: string
          format: uuid
          description: The series master of an override
        start:
          type: string
          format: date-time
        startDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - CONFIRMED
          - TENTATIVE
          - CANCELLED
        syncState:
          type: string
          enum:
          - LOCAL
          - SYNCED
          - PENDING
          - ERROR
        timeZone:
          type: string
          description: IANA zone id the timed event was planned in
          example: Europe/Zurich
        title:
          type: string
        transparency:
          type: string
          enum:
          - OPAQUE
          - TRANSPARENT
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
      required:
      - allDay
      - attendees
      - calendarId
      - createdAt
      - exdates
      - id
      - reminderMinutes
      - status
      - syncState
      - title
      - transparency
      - updatedAt
      - version
