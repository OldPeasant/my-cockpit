        count:
          type: integer
          format: int32
          description: At least 1
        date:
          type: string
          format: date
      required:
      - count
      - date
    HabitListResponse:
      type: object
      description: "Habits, by name"
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HabitResponse"
      required:
      - items
    HabitRequest:
      type: object
      description: "A habit's editable fields. `name` is required on create; `schedule`\
        \ defaults to DAILY, `targetCount` to 1. TIMES_PER_WEEK needs `timesPerWeek`,\
        \ WEEKDAYS needs `weekdays`; fields that do not fit the schedule are cleared."
      properties:
        archived:
          type: boolean
        name:
          type: string
          maxLength: 200
        reminderTime:
          type: string
          format: time
          description: "Local time of the reminder on due days (`HH:mm` or `HH:mm:ss`,\
            \ seconds are dropped); `null`: no reminder"
          example: 07:30
        schedule:
          type: string
          enum:
          - DAILY
          - TIMES_PER_WEEK
          - WEEKDAYS
        targetCount:
          type: integer
          format: int32
          maximum: 1000
          minimum: 1
        timesPerWeek:
          type: integer
          format: int32
          maximum: 7
          minimum: 1
        weekdays:
          type: array
          items:
            type: string
            enum:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
    HabitResponse:
      type: object
      description: A habit with its state today. `version` is also sent as the ETag.
      properties:
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
        reminderTime:
          type: string
          format: time
          description: "Local time (owner's time zone) of the daily reminder on due\
            \ days, `HH:mm:ss`"
          example: 07:30:00
        schedule:
          type: string
          enum:
          - DAILY
          - TIMES_PER_WEEK
          - WEEKDAYS
        stats:
          $ref: "#/components/schemas/HabitStatsResponse"
        targetCount:
          type: integer
          format: int32
          description: Count that makes a day done
        timesPerWeek:
          type: integer
          format: int32
          description: "Days per week, 1-7; only for TIMES_PER_WEEK"
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
        weekdays:
          type: array
          description: "The due weekdays, in week order; only for WEEKDAYS (else empty)"
          items:
            type: string
            enum:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
      required:
      - archived
      - createdAt
      - id
      - name
      - schedule
      - stats
      - targetCount
      - updatedAt
      - version
      - weekdays
    HabitStatsResponse:
      type: object
      description: "A habit's state on the owner's today. Streaks count due days done\
        \ in a row (TIMES_PER_WEEK: weeks with at least `timesPerWeek` done days,\
        \ from the owner's week start); today (this week) does not break a streak\
        \ while it is still open. The 30-day completion covers the last 30 days up\
        \ to today (today once done), not before the habit existed."
      properties:
        completionRateLast30Days:
          type: number
          format: double
          description: "doneLast30Days / dueLast30Days, at most 1; `null` without\
            \ due days"
          maximum: 1
          minimum: 0
        currentStreak:
          type: integer
          format: int32
        doneLast30Days:
          type: integer
          format: int32
          description: Done days in the last 30 days
        doneToday:
          type: boolean
          description: todayCount reached targetCount
        dueLast30Days:
          type: integer
          format: int32
          description: "Due days in the last 30 days (TIMES_PER_WEEK: timesPerWeek\
            \ per 7 days, rounded)"
        dueToday:
          type: boolean
          description: "Whether the habit is due today (TIMES_PER_WEEK: while this\
            \ week's quota was not reached before today)"
        longestStreak:
          type: integer
          format: int32
        streakUnit:
          type: string
          description: "WEEKS for TIMES_PER_WEEK, else DAYS"
          enum:
          - DAYS
          - WEEKS
        today:
          type: string
          format: date
          description: The owner's today
        todayCount:
          type: integer
          format: int32
      required:
      - currentStreak
      - doneLast30Days
      - doneToday
      - dueLast30Days
      - dueToday
      - longestStreak
      - streakUnit
      - today
      - todayCount
