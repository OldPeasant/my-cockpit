            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Changed concurrently, or the calendar is read-only or cannot\
            \ be changed"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match was sent and does not match the task's current ETag
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The calendar provider of a synced calendar failed; nothing
            was changed
      summary: Move a task to the calendar (convert it into an event)
      tags:
      - Tasks
  /api/v1/tasks/{id}/convert-to-note:
    post:
      description: "Creates a note with the task's title and its notes as body, links\
        \ every existing item linked to the task to the note (manual links, same direction\
        \ and label) and moves the task to the Trash, in one transaction. `If-Match`\
        \ is optional."
