          maxLength: 500
        notesMd:
          type: string
          maxLength: 100000
        organization:
          type: string
          maxLength: 500
        phones:
          type: array
          items:
            $ref: "#/components/schemas/ContactPhoneDto"
        photoFileId:
          type: string
          format: uuid
