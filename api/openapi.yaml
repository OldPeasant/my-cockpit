      - version
    ConvertToEventRequest:
      type: object
      description: "Where and when the event takes place. Timed: `start`, `end` (default\
        \ `start` + 1 hour) and `timeZone` (default the user's); all-day (`allDay:\
        \ true`): `startDate` and the exclusive `endDate` (default the day after).\
        \ `calendarId` defaults to the default calendar."
      properties:
        allDay:
          type: boolean
          description: Default false
        calendarId:
          type: string
          format: uuid
        end:
          type: string
          format: date-time
        endDate:
          type: string
          format: date
        start:
          type: string
          format: date-time
        startDate:
          type: string
          format: date
        timeZone:
          type: string
          example: Europe/Zurich
    CreateAreaRequest:
      type: object
      description: A new area
      properties:
        position:
          type: integer
          format: int32
          description: "Default: at the end"
        title:
          type: string
          maxLength: 200
      required:
      - title
    CreateBookmarkRequest:
      type: object
      description: A new bookmark. Only `url` is required; an empty title or description
        is filled from the page.
      properties:
        description:
          type: string
          maxLength: 2000
        readLater:
          type: boolean
          description: Put into the read-later list (default false)
        tags:
          type: array
