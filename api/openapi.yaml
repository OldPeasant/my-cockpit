      tags:
      - Mail accounts
  /api/v1/mail/accounts/{id}/folders/{folderId}:
    patch:
      description: "`{\"role\": \"ARCHIVE\"}` makes the folder the account's Archive\
        \ (the folder that had the role loses it); `{\"role\": null}` gives it no\
        \ role. Either way detection leaves it alone from then on. `{\"automatic\"\
        : true}` hands the folder back to detection on the next sync."
