      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: folderId
        required: true
        schema:
          type: string
          format: uuid
      - description: The folder's ETag
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMailFolderRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailFolderResponse"
          description: "The changed folder, with its new ETag"
          headers:
            ETag:
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such folder
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is stale
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Set a folder's role by hand
      tags:
      - Mail accounts
  /api/v1/mail/accounts/{id}/test:
    post:
      description: "Logs in to the IMAP and the SMTP server with the stored settings.\
        \ Failures are reported in the body (200), per protocol, as an error code\
        \ with a fixed message."
      operationId: testMailAccountConnection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResponse"
          description: The outcome per protocol
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such account
      summary: Test the connection
      tags:
      - Mail accounts
  /api/v1/mail/image-proxy:
    get:
      description: "Fetches an `http`/`https` raster image (no SVG) for \"load images\"\
        , so the sender never sees the client. Only public internet hosts on ports\
        \ 80/443; size and time are limited (`cockpit.mail.read.image-proxy.*`). `GET\
        \ /messages/{id}?remoteImages=PROXY` rewrites image URLs to this endpoint."
      operationId: proxyMailImage
      parameters:
      - in: query
        name: url
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            image/*:
              schema:
                type: string
                format: binary
          description: The image
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not an http(s) URL, or not a public host or port"
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The image could not be loaded, is too large or no supported\
            \ image"
        "504":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The image server did not answer in time
      summary: Load a remote image of a mail through the server
      tags:
      - Mail messages
  /api/v1/mail/messages:
    get:
      description: "`folderId` lists that folder (`accountId`, if given, must be its\
        \ account); `accountId` alone lists the account's Inbox; neither lists the\
        \ unified Inbox of all accounts. With `threaded=true` each item is the newest\
        \ message of a conversation in that list, with `threadSize` and `threadUnread`\
        \ counted in the list; `GET /messages/{id}/thread` returns the whole conversation.\
        \ Only cached headers are read."
      operationId: listMailMessages
      parameters:
      - in: query
        name: accountId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: folderId
        required: false
        schema:
          type: string
          format: uuid
      - description: One item per conversation instead of per message
        in: query
        name: threaded
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailMessageListResponse"
          description: One page of messages
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Malformed cursor, limit or a folder of another account"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such account or folder
      summary: "List messages, newest first"
      tags:
      - Mail messages
  /api/v1/mail/messages/actions:
    post:
      description: "Applies `action` on the mail server and in the cache. `MOVE` needs\
        \ `targetFolderId` (a folder of the messages' account); `ARCHIVE`, `DELETE`\
        \ and `SPAM` move to the account's Archive, Trash or Spam folder; `DELETE`\
        \ of a message in Trash deletes it permanently. A moved message keeps its\
        \ id when the server reports its new UID. Each id succeeds or fails on its\
        \ own: the response has one result per distinct id in request order, with\
        \ an `errorCode` for a failure (`NOT_FOUND`, `NO_ROLE_FOLDER`, `OTHER_ACCOUNT`,\
        \ `REJECTED` or a mail server error such as `CONNECTION_FAILED` or `POOL_EXHAUSTED`)."
      operationId: applyMailAction
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailActionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailActionResponse"
          description: One result per id; also when some or all of them failed
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No or too many ids, unknown action, `targetFolderId` missing\
            \ for MOVE or given for another action"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such target folder
      summary: "Mark, flag, move, archive, delete or report messages as spam"
      tags:
      - Mail messages
  /api/v1/mail/messages/{id}:
    get:
      description: "Loads the body from the server on first access, then from the\
        \ body cache. `body.html` is sanitized (render it in a sandboxed iframe);\
        \ remote images are removed (`remoteImages=BLOCK`, default) or rewritten to\
        \ the image proxy (`PROXY`), `cid:` images point to the attachment download.\
        \ A message that moved resolves to its current copy (its `id` may differ from\
        \ the requested one)."
      operationId: getMailMessage
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: remoteImages
        required: false
        schema:
          type: string
          default: BLOCK
          enum:
          - BLOCK
          - PROXY
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailMessageResponse"
          description: "The message, with its version as ETag"
          headers:
            ETag:
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Malformed id or unknown `remoteImages` value
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such message, or it is no longer on the server"
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The mail server failed
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: All connections of the account are busy (`errorCode` POOL_EXHAUSTED);
            retry later
      summary: "One message with headers, sanitized body and attachments"
      tags:
      - Mail messages
  /api/v1/mail/messages/{id}/attachments/{partId}:
    get:
      description: "Streams the decoded part from the mail server. Always a download\
        \ (`Content-Disposition: attachment`), except with `inline=true` for raster\
        \ images (inline `cid:` images, previews)."
      operationId: downloadMailAttachment
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: partId
        required: true
        schema:
          type: string
      - in: query
        name: inline
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: The attachment
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such message or attachment
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The mail server failed
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: All connections of the account are busy (`errorCode` POOL_EXHAUSTED);
            retry later
      summary: Download an attachment
      tags:
      - Mail messages
  /api/v1/mail/messages/{id}/thread:
    get:
      description: "Every cached message of the conversation in the message's account\
        \ (all folders), oldest first."
      operationId: getMailThread
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailThreadResponse"
          description: The conversation
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such message
      summary: The conversation of a message
      tags:
      - Mail messages
  /api/v1/mail/messages/{id}/to-note:
    post:
      description: "The note is titled with the subject; its body lists sender, recipients\
        \ and date, then the mail's plain text (the HTML part as text when there is\
        \ none), and it is linked to the message. Loads the body from the mail server\
        \ when it is not cached."
      operationId: mailToNote
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailGtdItemResponse"
          description: Created and linked; `Location` is the new item
          headers:
            Location:
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Malformed id
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such message, or it is no longer on the server"
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The mail server failed
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: All connections of the account are busy (`errorCode` POOL_EXHAUSTED);
            retry later
      summary: Create a note from a message
      tags:
      - Mail messages
  /api/v1/mail/messages/{id}/to-task:
    post:
      description: "The task is titled with the subject and linked to the message\
        \ (a manual link, shown on both). A message that moved resolves to its current\
        \ copy, which the link points at; the link keeps working after later moves."
      operationId: mailToTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailGtdItemResponse"
          description: Created and linked; `Location` is the new item
          headers:
            Location:
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Malformed id
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such message, or it is no longer on the server"
      summary: Create an Inbox task from a message
      tags:
      - Mail messages
  /api/v1/mail/messages/{id}/to-waiting:
    post:
      description: "The task is titled with the subject, waits since the mail's date\
        \ and is linked to the message. For a sent mail (in the Sent folder, or from\
        \ the account's address or one of its identities) `waitingForText` names the\
        \ recipients (To, else Cc, else Bcc); for a received mail its sender."
      operationId: mailToWaiting
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailGtdItemResponse"
          description: Created and linked; `Location` is the new item
          headers:
            Location:
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Malformed id
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such message, or it is no longer on the server"
      summary: Create a Waiting For task from a message
      tags:
      - Mail messages
  /api/v1/mail/search:
    get:
      description: "Every word of `q` must match the start of a word of a cached message's\
        \ subject, sender, recipients or cached body (exact or English-stemmed form).\
        \ `folderId` searches that folder, `accountId` alone all folders of the account,\
        \ neither all folders of all accounts. With `server=true` the folders are\
        \ also searched on the mail server (IMAP SEARCH: substrings of headers and\
        \ body, also mail older than the sync window); found messages are cached and\
        \ returned with the cached hits, at most `limit` per folder. An account whose\
        \ server fails is listed in `server.failures`; the search still answers. A\
        \ query without letters or digits finds nothing."
      operationId: searchMail
      parameters:
      - description: Search text
        in: query
        name: q
        required: true
        schema:
          type: string
          maxLength: 200
          minLength: 1
      - in: query
        name: accountId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: folderId
        required: false
        schema:
          type: string
          format: uuid
      - description: Also search on the mail server (slower)
        in: query
        name: server
        required: false
        schema:
          type: boolean
          default: false
      - description: "Maximum number of messages, 1..200"
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailSearchResponse"
          description: "The matching messages, newest first"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Blank or too long `q`, `limit` out of range, or a folder of\
            \ another account"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such account or folder
      summary: "Search mail, newest first"
      tags:
      - Mail search
  /api/v1/notes:
    get:
      description: "Notes matching every given filter, not in the Trash: pinned first,\
        \ then the most recently changed."
      operationId: listNotes
      parameters:
      - description: Only notes with this tag (regardless of case)
        in: query
        name: tag
        required: false
        schema:
          type: string
      - description: "true: only pinned notes, false: only notes that are not pinned"
        in: query
        name: pinned
        required: false
        schema:
          type: boolean
      - description: "false (default): only notes that are not archived, true: only\
          \ archived notes, all: both"
        in: query
        name: archived
        required: false
        schema:
          type: string
          enum:
          - "true"
          - "false"
          - all
      - description: Cursor from the previous page
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: "Page size, 1-200 (default 50)"
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotePageResponse"
          description: One page of notes
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
      summary: List notes
      tags:
      - Notes
    post:
      operationId: createNote
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"
          description: Created
          headers:
            ETag:
              description: "Version of the note, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
      summary: Create a note
      tags:
      - Notes
  /api/v1/notes/tags:
    get:
      operationId: listNoteTags
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteTagListResponse"
          description: The tags
      summary: "Every tag in use, with its number of notes"
      tags:
      - Notes
  /api/v1/notes/{id}:
    delete:
      operationId: deleteNote
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the note
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "204":
          description: In the Trash
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Not found or in the Trash
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Move a note to the Trash
      tags:
      - Notes
    get:
      operationId: getNote
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"
          description: The note with its (new) ETag
          headers:
            ETag:
              description: "Version of the note, for If-Match"
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Not found or in the Trash
      summary: One note
      tags:
      - Notes
    patch:
      description: Only the fields sent change; `null` clears the title. A change
        of the title or body keeps the previous content as a revision (at most one
        per 5 minutes).
      operationId: updateNote
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the note
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotePatchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"
          description: The note with its (new) ETag
          headers:
            ETag:
              description: "Version of the note, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Not found or in the Trash
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Change a note
      tags:
      - Notes
  /api/v1/notes/{id}/images:
    post:
      description: "One image in the part `file`, stored in `/Attachments/Notes`.\
        \ The note does not change: insert the returned `markdown` into its body.\
        \ The mime type is the part's content type (or guessed from the filename)."
      operationId: uploadNoteImage
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteImageResponse"
          description: Stored
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Not found or in the Trash
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Larger than the configured maximum file size
      summary: Store an image for a note
      tags:
      - Notes
  /api/v1/notes/{id}/revisions:
    get:
      operationId: listNoteRevisions
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteRevisionListResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/NoteRevisionListResponse"
          description: The revisions
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Not found or in the Trash
      summary: "Earlier versions of a note (the last 20), newest first"
      tags:
      - Notes
  /api/v1/notes/{id}/revisions/{number}/restore:
    post:
      description: "Sets the title and body to those of the revision; tags, pin and\
        \ archive state stay. The replaced content becomes a new revision, so the\
        \ restore can be undone."
      operationId: restoreNoteRevision
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: Number of the revision
        in: path
        name: number
        required: true
        schema:
          type: integer
          format: int32
      - description: ETag of the note
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"
          description: The note with its (new) ETag
          headers:
            ETag:
              description: "Version of the note, for If-Match"
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Not found or in the Trash
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Put an earlier version back
      tags:
      - Notes
  /api/v1/oauth/connections:
    get:
      operationId: listOAuthConnections
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OAuthConnectionResponse"
          description: All connections (tokens are never returned)
      summary: "The connected accounts with their status, oldest first"
      tags:
      - OAuth
  /api/v1/oauth/connections/{id}:
    delete:
      description: "Removes the connection and its tokens, and revokes the refresh\
        \ token at Google (Microsoft has no revocation endpoint: remove the app under\
        \ the account's privacy settings). Calendar sources and mail accounts using\
        \ the connection stop syncing."
      operationId: disconnectOAuthConnection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: The connection's ETag
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Disconnected
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such connection
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is stale
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Disconnect an account
      tags:
      - OAuth
    get:
      operationId: getOAuthConnection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthConnectionResponse"
          description: "The connection, with its version as ETag"
          headers:
            ETag:
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such connection
      summary: One connection
      tags:
      - OAuth
  /api/v1/oauth/providers:
    get:
      operationId: listOAuthProviders
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OAuthProviderResponse"
          description: Both providers
      summary: The providers and whether their OAuth app is configured
      tags:
      - OAuth
  /api/v1/oauth/{provider}/callback:
    get:
      description: "Accepts only the state of a pending flow of the same browser session,\
        \ exchanges the code and stores the encrypted refresh token. Redirects to\
        \ `/settings/integrations` with `oauth=connected&provider=&purpose=&connectionId=`\
        \ or `oauth=error&provider=&error=` (`invalid_state`, `access_denied`, `token_exchange_failed`,\
        \ `no_refresh_token`) and, when known, `purpose=`."
      operationId: completeOAuthConnection
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
          enum:
          - google
          - microsoft
      - in: query
        name: code
        required: false
        schema:
          type: string
      - in: query
        name: state
        required: false
        schema:
          type: string
      - in: query
        name: error
        required: false
        schema:
          type: string
      responses:
        "302":
          description: Redirect to the SPA
          headers:
            Location:
              description: The SPA page showing the outcome
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unknown provider
      summary: The provider's redirect back (browser navigation)
      tags:
      - OAuth
  /api/v1/oauth/{provider}/start:
    get:
      description: "Redirects to the provider's consent screen (authorization code\
        \ flow with PKCE) asking for the combined calendar, mail and contacts scopes.\
        \ The flow is bound to the current browser session and expires after 10 minutes.\
        \ Connecting an account that is already connected updates that connection."
      operationId: startOAuthConnection
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
          enum:
          - google
          - microsoft
      - description: What the account is connected for; passed back to the SPA after
          the callback
        in: query
        name: purpose
        required: true
        schema:
          type: string
          enum:
          - CALENDAR
          - MAIL
          - CONTACTS
      responses:
        "302":
          content:
            '*/*':
              schema:
                type: object
          description: Redirect to the provider
          headers:
            Location:
              description: The provider's authorization URL
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or unknown purpose
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No browser session
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unknown provider
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The provider's OAuth app is not configured on this server
      summary: Start connecting a provider account (browser navigation)
      tags:
      - OAuth
  /api/v1/projects:
    get:
      description: "Projects matching every given filter, not in the Trash, ordered\
        \ by title, then id."
      operationId: listProjects
      parameters:
      - description: Only projects with this status
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - ON_HOLD
          - SOMEDAY
          - COMPLETED
          - DROPPED
      - description: Only projects in this area
        in: query
        name: areaId
        required: false
        schema:
          type: string
          format: uuid
      - description: "true: only stalled projects, false: only projects that are not\
          \ stalled"
        in: query
        name: stalled
        required: false
        schema:
          type: boolean
      - description: Cursor from the previous page
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: "Page size, 1-200 (default 50)"
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPageResponse"
          description: One page of projects
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
      summary: List projects
      tags:
      - Projects
    post:
      operationId: createProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
          description: Created
          headers:
            ETag:
              description: "Version of the project, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
      summary: Create a project
      tags:
      - Projects
  /api/v1/projects/{id}:
    delete:
      description: Its tasks keep their project.
      operationId: deleteProject
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the project
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "204":
          description: In the Trash
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found (projects: or in the Trash)"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Changed concurrently, or (contexts) the name is taken"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Move a project to the Trash
      tags:
      - Projects
    get:
      operationId: getProject
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
          description: The project with its (new) ETag
          headers:
            ETag:
              description: "Version of the project, for If-Match"
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found (projects: or in the Trash)"
      summary: One project
      tags:
      - Projects
    patch:
      description: Only the fields sent change; `null` clears a field. Unknown fields
        (including `nextTaskId`) are rejected.
      operationId: updateProject
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the project
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
          description: The project with its (new) ETag
          headers:
            ETag:
              description: "Version of the project, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found (projects: or in the Trash)"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Changed concurrently, or (contexts) the name is taken"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Change a project
      tags:
      - Projects
  /api/v1/projects/{id}/next-step:
    post:
      description: "The task must be an open task of the project (create a new one\
        \ with `POST /tasks` and `projectId` first); `taskId: null` clears the next\
        \ step. `taskId` must be sent; other fields are rejected. `If-Match` is optional."
      operationId: setProjectNextStep
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the project (optional)
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NextStepRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
          description: The project with its (new) ETag
          headers:
            ETag:
              description: "Version of the project, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found (projects: or in the Trash)"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Changed concurrently, or (contexts) the name is taken"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Designate the project's next step
      tags:
      - Projects
  /api/v1/projects/{id}/order:
    put:
      description: "The listed tasks come first, in the given order, then the project's\
        \ other tasks (open and done) in their previous order. Changes the tasks'\
        \ `position` (and version), not the project."
      operationId: orderProjectTasks
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderTasksRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
          description: All tasks of the project (not in the Trash) in the new order
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found (projects: or in the Trash)"
      summary: Order the project's tasks
      tags:
      - Projects
  /api/v1/reminders:
    get:
      description: "All reminders of the item, fired or not, earliest first."
      operationId: listReminders
      parameters:
      - description: Type of the item
        in: query
        name: itemType
        required: true
        schema:
          type: string
          enum:
          - TASK
          - PROJECT
          - NOTE
          - EVENT
          - EMAIL
          - FILE
          - FOLDER
          - CONTACT
          - BOOKMARK
          - JOURNAL_ENTRY
          - HABIT
      - description: Id of the item
        in: query
        name: itemId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListResponse"
          description: The item's reminders (empty when it has none or does not exist)
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid itemType or itemId
      summary: The reminders of an item
      tags:
      - Reminders
    post:
      description: "A time in the past is allowed: the reminder fires on the next\
        \ scheduler run (within seconds). An item that does not exist is rejected;\
        \ an item whose type has no module yet is accepted."
      operationId: createReminder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReminderRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResponse"
          description: Created; `Location` points to the reminder
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid request or unknown item
      summary: Add a reminder to an item
      tags:
      - Reminders
  /api/v1/reminders/upcoming:
    get:
      description: "Reminders that have not fired yet and are due at or before `until`,\
        \ overdue ones included, earliest first, at most 1000. The Android app schedules\
        \ local alarms from them."
      operationId: listUpcomingReminders
      parameters:
      - description: Latest reminder time to include (ISO-8601 instant)
        example: 2026-10-27T00:00:00Z
        in: query
        name: until
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListResponse"
          description: The pending reminders
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid until
      summary: "Reminders not fired yet, up to a time"
      tags:
      - Reminders
  /api/v1/reminders/{id}:
    delete:
      description: "Reminders never change after creation (only the server sets `firedAt`),\
        \ so no `If-Match` is needed."
      operationId: deleteReminder
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such reminder
      summary: Remove a reminder
      tags:
      - Reminders
    get:
      operationId: getReminder
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResponse"
          description: The reminder
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such reminder
      summary: One reminder
      tags:
      - Reminders
  /api/v1/restore:
    post:
      description: "Stores the backup zip and returns its validation report; no data\
        \ changes. A valid backup gets an `id` to confirm the restore with; an invalid\
        \ one (`valid: false`, see `problems`) is discarded. A new upload discards\
        \ the previous one."
      operationId: uploadRestore
      requestBody:
        content:
          application/zip:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreReportResponse"
          description: The validation report
      summary: Upload a backup and validate it
      tags:
      - Backup
  /api/v1/restore/{id}/confirm:
    post:
      description: "Saves the current data as a backup to `pre-restore/` in the data\
        \ directory, then replaces all data with the upload, in one transaction: on\
        \ failure nothing changes. Sessions are replaced too, so the client signs\
        \ in again afterwards. The upload is used up, also when the restore fails,\
        \ but not by a wrong passphrase. With the backup's `passphrase` its secrets\
        \ are restored (and the pre-restore backup is made with it too); without,\
        \ accounts must be reconnected and TOTP is set up again on the next login.\
        \ The body is optional."
      operationId: confirmRestore
      parameters:
      - description: "Id of the upload, from its validation report"
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmRestoreRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResultResponse"
          description: Restored
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid id
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such upload (unknown, invalid, discarded by a newer one\
            \ or used up)"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: A backup is running
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The passphrase is wrong, or the backup's data could not be\
            \ imported; nothing changed. `problems` lists why, if known."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The current data could not be backed up to `pre-restore/` first;
            nothing changed
      summary: Replace all data with an uploaded backup
      tags:
      - Backup
  /api/v1/search:
    get:
      description: "Every word of `q` must match the start of a word of an item's\
        \ title or text (exact or English-stemmed form); hits rank by relevance (title\
        \ before text) and recency. When that finds fewer than `limit` items, items\
        \ whose title is similar to `q` (typos, fragments) fill up the rest. Results\
        \ are grouped by type, groups ordered by their best hit; `limit` counts items\
        \ across all groups. Items in the Trash are not found. A query without letters\
        \ or digits finds nothing."
      operationId: search
      parameters:
      - description: Search text
        in: query
        name: q
        required: true
        schema:
          type: string
          maxLength: 200
          minLength: 1
      - description: Only these item types (comma-separated or repeated); all types
          when absent
        in: query
        name: types
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - TASK
            - PROJECT
            - NOTE
            - EVENT
            - EMAIL
            - FILE
            - FOLDER
            - CONTACT
            - BOOKMARK
            - JOURNAL_ENTRY
            - HABIT
      - description: "Maximum number of items, 1..50"
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 50
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
          description: "The matching items, grouped by type"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Blank or too long `q`, unknown type, or `limit` out of range"
      summary: Search all items
      tags:
      - Search
  /api/v1/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
          description: Every registered setting
          headers:
            ETag:
              description: "Version of the settings, for If-Match"
              schema:
                type: string
              style: simple
      summary: "All settings, unset ones with their defaults"
      tags:
      - Settings
    patch:
      description: "Sets the given keys; `null` resets a key to its default, keys\
        \ not sent stay unchanged. Nothing is changed when a key is unknown or a value\
        \ invalid (400, one error per key)."
      operationId: updateSettings
      parameters:
      - description: ETag from the last GET or PATCH
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
          description: Settings changed; all settings with the new ETag
          headers:
            ETag:
              description: New version of the settings
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unknown key or invalid value
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Change settings
      tags:
      - Settings
  /api/v1/setup:
    post:
      description: "Returns the TOTP secret and recovery codes exactly once. Calling\
        \ it again before the TOTP is confirmed replaces the pending account only\
        \ with the same username and password, or once the pending account is older\
        \ than 1 hour; otherwise it answers 409."
      operationId: startSetup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResponse"
          description: "Account created, TOTP confirmation pending"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid username or password
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Setup is already complete, or another setup is in progress"
      summary: Create the owner account and start the TOTP enrollment
      tags:
      - Setup
  /api/v1/setup/confirm-totp:
    post:
      operationId: confirmSetupTotp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTotpRequest"
        required: true
      responses:
        "204":
          description: "Setup complete, the account is active"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The code is not valid for the TOTP secret
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Setup is already complete, or was not started"
      summary: Activate the account with a code from the authenticator app
      tags:
      - Setup
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"
          description: OK
      summary: Whether the first-run setup still has to be completed
      tags:
      - Setup
  /api/v1/tasks:
    get:
      description: "Tasks matching every given filter, not in the Trash and not in\
        \ a tickler (`ticklerDate` after today). Due ticklers move back to the INBOX\
        \ and due SCHEDULED tasks to NEXT before the list is read. Open tasks (default)\
        \ are ordered by position, then id; with `completed=true` the done tasks (Logbook)\
        \ are returned, newest first. `due` is relative to today in the user's time\
        \ zone: OVERDUE before today, TODAY today, WEEK today and the next 6 days.\
        \ `maxMinutes` only matches tasks with an estimate. `from` and `to` (both\
        \ or neither, inclusive, at most 366 days) only match tasks whose due or tickler\
        \ date is in that range, including tasks still in a tickler (the calendar\
        \ overlay)."
      operationId: listTasks
      parameters:
      - description: Only tasks on this list
        in: query
        name: list
        required: false
        schema:
          type: string
          enum:
          - INBOX
          - NEXT
          - WAITING
          - SOMEDAY
          - SCHEDULED
      - description: Only tasks of this project
        in: query
        name: projectId
        required: false
        schema:
          type: string
          format: uuid
      - description: Only tasks with this context (id)
        in: query
        name: context
        required: false
        schema:
          type: string
          format: uuid
      - description: Only tasks with this energy
        in: query
        name: energy
        required: false
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
      - description: Only tasks with this creativity
        in: query
        name: creativity
        required: false
        schema:
          type: string
          enum:
          - ROUTINE
          - MIXED
          - CREATIVE
      - description: Only tasks estimated at most this many minutes
        in: query
        name: maxMinutes
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - description: Only tasks due in this window (case-insensitive)
        in: query
        name: due
        required: false
        schema:
          type: string
          enum:
          - overdue
          - today
          - week
      - description: "true: done tasks (Logbook) instead of open ones"
        in: query
        name: completed
        required: false
        schema:
          type: boolean
          default: false
      - description: Only tasks due or in a tickler on or after this date
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - description: Only tasks due or in a tickler on or before this date
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - description: Cursor from the previous page
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: "Page size, 1-200 (default 50)"
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPageResponse"
          description: One page of tasks
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid filter, cursor or limit"
      summary: List tasks
      tags:
      - Tasks
    post:
      description: "With a client-generated `id` (UUIDv7) the create is idempotent:\
        \ repeating it returns the existing task (200) unchanged."
      operationId: createTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: A task with this id already exists; it is returned unchanged
          headers:
            ETag:
              description: "Version of the task, for If-Match"
              schema:
                type: string
              style: simple
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: Created
          headers:
            ETag:
              description: "Version of the task, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid fields, an unknown project or context, or SCHEDULED\
            \ without a date"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The id belongs to a task in the Trash
      summary: Create a task
      tags:
      - Tasks
  /api/v1/tasks/{id}:
    delete:
      operationId: deleteTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the task
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "204":
          description: In the Trash
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task, or it is already in the Trash"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Move a task to the Trash
      tags:
      - Tasks
    get:
      description: "Due ticklers move back to the INBOX and due SCHEDULED tasks to\
        \ NEXT before the task is read, so its list, dates and ETag may differ from\
        \ an earlier read."
      operationId: getTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: The task
          headers:
            ETag:
              description: "Version of the task, for If-Match"
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task, or it is in the Trash"
      summary: One task
      tags:
      - Tasks
    patch:
      description: Only the fields sent change; `null` clears a field. Unknown fields
        (including `list`) are rejected.
      operationId: updateTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the task
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: Changed; the task with its new ETag
          headers:
            ETag:
              description: New version of the task
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task, or it is in the Trash"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Change a task
      tags:
      - Tasks
  /api/v1/tasks/{id}/complete:
    post:
      description: "Completing a done task keeps its completion time. `needsNextStep`\
        \ is true when the task is the next step of an ACTIVE project: the client\
        \ then asks for a new next step (`POST /projects/{id}/next-step`). `If-Match`\
        \ is optional."
      operationId: completeTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the task (optional)
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletedTaskResponse"
          description: "The done task with its new ETag, and whether its project needs\
            \ a new next step"
          headers:
            ETag:
              description: New version of the task
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task, or it is in the Trash"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match was sent and does not match the current ETag
      summary: Mark a task done
      tags:
      - Tasks
  /api/v1/tasks/{id}/convert-to-event:
    post:
      description: "Creates an event with the task's title and its notes as description\
        \ at the given times, links every existing item linked to the task to the\
        \ event (manual links, same direction and label) and moves the task to the\
        \ Trash, in one transaction. `If-Match` is optional."
      operationId: convertTaskToEvent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the task (optional)
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertToEventRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: The new event; `Location` points to it
          headers:
            ETag:
              description: "Version of the event, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid or missing times, an unknown calendar or no calendar\
