          type: string
          format: date-time
        folderId:
          type: string
          format: uuid
          description: The folder; `null` at the drive root
        id:
          type: string
          format: uuid
        mime:
          type: string
        name:
          type: string
        sha256:
          type: string
          description: Lowercase hex SHA-256 of the contents
        size:
          type: integer
          format: int64
          description: Size in bytes
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
      required:
      - createdAt
      - id
      - mime
      - name
      - sha256
      - size
      - updatedAt
      - version
    FolderPatchRequest:
      type: object
      description: "Changes of a folder: only the fields sent change. `parentId: null`\
        \ moves it to the drive root."
      properties:
        name:
          type: string
          maxLength: 255
        parentId:
          type:
          - string
          - "null"
          format: uuid
    FolderResponse:
      type: object
      description: A folder of the drive. `version` is also sent as the ETag.
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
        parentId:
          type: string
          format: uuid
          description: The parent folder; `null` at the drive root
        path:
          type: string
