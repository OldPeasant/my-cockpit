openapi: 3.1.0
info:
  title: My Cockpit API
  version: v1
servers:
- url: /
tags:
- description: "Connections to Google and Microsoft accounts, shared by calendar,\
    \ mail and contacts"
  name: OAuth
- description: Calendars and their events
  name: Calendars
- description: Web login sessions and device tokens
  name: Auth
- description: GTD tasks
  name: Tasks
- description: Create and download backups
  name: Backup
- description: User settings
  name: Settings
- description: Quick capture to the Inbox
  name: Capture
- description: First-run creation of the owner account
  name: Setup
- description: "GTD projects, areas of focus and contexts"
  name: Projects
- description: Links between items of any type
  name: Links
- description: "Deleted items: list, restore, delete permanently"
  name: Trash
- description: "Reminders for items of any type. When a reminder is due, the server\
    \ fires it once and sends the SSE event `reminder` on `GET /api/v1/events` with\
    \ a `ReminderResponse` as data. Every change also sends a `change` event of type\
    \ `REMINDER`."
  name: Reminders
- description: Change notifications (Server-Sent Events)
  name: Events
- description: "IMAP/SMTP accounts with password, and Google/Microsoft accounts through\
    \ an OAuth connection (XOAUTH2). Passwords are write-only. Changes send `change`\
    \ events of type `MAIL_ACCOUNT` and `MAIL_FOLDER`."
  name: Mail accounts
- description: Global search across all item types
  name: Search
paths:
  /api/v1/areas:
    get:
      operationId: listAreas
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaListResponse"
          description: The areas
      summary: All areas in order
      tags:
      - Projects
    post:
      operationId: createArea
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAreaRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
          description: Created
          headers:
            ETag:
              description: "Version of the area, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
      summary: Create an area
      tags:
      - Projects
  /api/v1/areas/order:
    put:
      operationId: orderAreas
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaListResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AreaListResponse"
          description: All areas in the new order
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
      summary: Reorder all areas
      tags:
      - Projects
  /api/v1/areas/{id}:
    delete:
      description: Deleted for good (areas have no Trash); its projects no longer
        have an area.
      operationId: deleteArea
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the area
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Deleted
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found (projects: or in the Trash)"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Changed concurrently, or (contexts) the name is taken"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Delete an area
      tags:
      - Projects
    get:
      operationId: getArea
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
          description: The area with its (new) ETag
          headers:
            ETag:
              description: "Version of the area, for If-Match"
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found (projects: or in the Trash)"
      summary: One area
      tags:
      - Projects
    patch:
      description: Only the fields sent change; neither can be cleared. Unknown fields
        are rejected.
      operationId: updateArea
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the area
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAreaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
          description: The area with its (new) ETag
          headers:
            ETag:
              description: "Version of the area, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not found (projects: or in the Trash)"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Changed concurrently, or (contexts) the name is taken"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Change an area
      tags:
      - Projects
  /api/v1/auth/devices:
    get:
      operationId: listDevices
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceResponse"
          description: The devices
        "401":
          description: Not logged in
      summary: "Devices logged in with tokens, oldest first"
      tags:
      - Auth
  /api/v1/auth/devices/{id}:
    delete:
      operationId: revokeDevice
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Revoked
        "401":
          description: Not logged in
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such device
      summary: Revoke a device; its tokens stop working immediately
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      description: "Sends exactly one of `totp` and `recoveryCode`; a recovery code\
        \ works only once. On success the session cookie is set: persistent for a\
        \ sliding 30 days with `rememberDevice`, a browser-session cookie otherwise.\
        \ After 5 consecutive failures further attempts are blocked for an exponentially\
        \ growing time."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: "Logged in, session cookie set"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing fields, or not exactly one of totp and recoveryCode"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Wrong credentials (does not say which part was wrong)
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many failed attempts; retry after the given number of seconds
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
              style: simple
      summary: Log in with password and a TOTP or recovery code
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Logged out (also when there was no session)
      summary: End the current session and clear its cookie
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: Logged in
        "401":
          description: Not logged in
      summary: The logged-in user
      tags:
      - Auth
  /api/v1/auth/recovery-codes:
    post:
      description: "Needs a current TOTP code and shares the login throttle. Returns\
        \ 10 new single-use codes exactly once; all previous codes, used or not, stop\
        \ working."
      operationId: regenerateRecoveryCodes
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateRecoveryCodesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesResponse"
          description: New recovery codes
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid TOTP code
        "401":
          description: Not logged in
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Setup is not complete: there is no active account"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many failed attempts; retry after the given number of seconds
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
              style: simple
      summary: Replace all recovery codes with new ones
      tags:
      - Auth
  /api/v1/auth/token:
    post:
      description: "Takes the same credentials as the web login (exactly one of `totp`\
        \ and `recoveryCode`) plus a device name, and is throttled together with it.\
        \ The access token is valid for 15 minutes, the refresh token until it is\
        \ rotated or 90 days without a refresh. No CSRF token is needed."
      operationId: issueDeviceToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Device registered
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing fields, or not exactly one of totp and recoveryCode"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Wrong credentials (does not say which part was wrong)
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many failed attempts; retry after the given number of seconds
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
              style: simple
      summary: Log a device in and get its access and refresh tokens
      tags:
      - Auth
  /api/v1/auth/token/refresh:
    post:
      description: Returns a new access and refresh token; the refresh token sent
        is no longer valid. Sending a refresh token again after it was rotated revokes
        the device. No CSRF token is needed.
      operationId: refreshDeviceToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: New tokens
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing refresh token
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unknown, expired, already rotated or revoked refresh token"
      summary: Rotate a device's tokens
      tags:
      - Auth
  /api/v1/backup:
    post:
      description: "Builds the backup zip in the background. Progress arrives on `GET\
        \ /api/v1/events` as change events of type `BACKUP` with the job's id; refetch\
        \ the job on each. When its state is `COMPLETED`, download the zip. Starting\
        \ a new backup discards earlier finished ones."
      operationId: startBackup
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupJobResponse"
          description: Started; `Location` points to the job
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Another backup is running
      summary: Start a backup
      tags:
      - Backup
  /api/v1/backup/{id}:
    get:
      operationId: getBackup
      parameters:
      - description: Id of the backup job
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupJobResponse"
          description: The backup job
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid id
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such backup (unknown, or discarded by a newer one)"
      summary: State and progress of a backup
      tags:
      - Backup
  /api/v1/backup/{id}/download:
    get:
      description: "The zip (format version 1): `README.md`, `manifest.json` (formatVersion,\
        \ appVersion, createdAt, counts, sha256 per file), `data/` (canonical JSON,\
        \ used for restore), `files/` (blobs), `readable/` (mirrors)."
      operationId: downloadBackup
      parameters:
      - description: Id of the backup job
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/zip:
              schema:
                type: string
                format: binary
          description: The backup zip
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid id
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such backup
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The backup is still running or failed
      summary: Download a completed backup
      tags:
      - Backup
  /api/v1/calendar/calendars:
    get:
      description: "Every calendar of every source, ordered by name."
      operationId: listCalendars
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarListResponse"
          description: The calendars
      summary: List calendars
      tags:
      - Calendars
    post:
      description: The calendar is stored in the cockpit. The first calendar becomes
        the default for new events.
      operationId: createCalendar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCalendarRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarResponse"
          description: Created
          headers:
            ETag:
              description: "Version of the calendar, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid fields
      summary: Create a local calendar
      tags:
      - Calendars
  /api/v1/calendar/calendars/{id}:
    get:
      operationId: getCalendar
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarResponse"
          description: The calendar
          headers:
            ETag:
              description: "Version of the calendar, for If-Match"
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such calendar
      summary: One calendar
      tags:
      - Calendars
    patch:
      description: "Only the fields sent change. Also allowed for calendars of external\
        \ sources (e.g. color, visibility)."
      operationId: updateCalendar
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: ETag of the calendar
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarPatchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarResponse"
          description: Changed; the calendar with its new ETag
          headers:
            ETag:
              description: New version of the calendar
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid or unknown fields
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such calendar
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Changed concurrently
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Change a calendar
      tags:
      - Calendars
  /api/v1/calendar/events:
    get:
      description: "Every occurrence overlapping [from, to) of the events of the given\
        \ calendars (default: the visible ones), series expanded, ordered by start.\
        \ All-day events count by the days the range touches in the user's time zone.\
        \ The range is at most 400 days."
      operationId: listEventOccurrences
      parameters:
      - description: "Start of the range (inclusive), ISO-8601 date-time"
        in: query
        name: from
        required: true
        schema:
          type: string
          format: date-time
      - description: "End of the range (exclusive), ISO-8601 date-time"
        in: query
        name: to
        required: true
        schema:
          type: string
          format: date-time
      - description: Only these calendars (comma-separated or repeated); default the
          visible calendars
        in: query
        name: calendarIds
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrenceListResponse"
          description: The occurrences
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid range
      summary: Occurrences in a range
      tags:
      - Calendars
    post:
      description: "In a local calendar (default: the default calendar). With a client-generated\
        \ `id` (UUIDv7) the create is idempotent: repeating it returns the existing\
        \ event (200) unchanged."
      operationId: createEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: An event with this id already exists; it is returned unchanged
          headers:
            ETag:
              description: "Version of the event, for If-Match"
              schema:
                type: string
              style: simple
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: Created
          headers:
            ETag:
              description: "Version of the event, for If-Match"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid fields, an unknown calendar, or no calendar given\
            \ and no default calendar"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The id belongs to an event in the Trash, or the calendar is\
            \ read-only or not local"
      summary: Create an event
      tags:
      - Calendars
  /api/v1/calendar/events/{id}:
    delete:
      description: "A single event or a whole series (ALL) goes to the Trash; THIS\
        \ removes one occurrence (EXDATE, or its override is cancelled); FOLLOWING\
        \ ends the series before the occurrence. Scope defaults as for PATCH."
      operationId: deleteEvent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: Which occurrences of a series to delete
        in: query
        name: scope
        required: false
        schema:
          type: string
          enum:
          - THIS
          - FOLLOWING
          - ALL
      - description: "Original start of the occurrence: an instant (timed series)\
          \ or a date (all-day series)"
        in: query
        name: occurrence
        required: false
        schema:
          type: string
      - description: ETag of the addressed event
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Deleted
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid or unknown fields, or a missing, malformed or mismatching\
            \ occurrence"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such event or occurrence, or the event is in the Trash"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Changed concurrently, or the calendar is read-only or not\
            \ local"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Delete an event or occurrences of a series
      tags:
      - Calendars
    get:
      description: "An event, series master or override."
      operationId: getEvent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: The event
          headers:
            ETag:
              description: "Version of the event, for If-Match"
              schema:
                type: string
              style: simple
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such event, or it is in the Trash"
      summary: One event
      tags:
      - Calendars
    patch:
      description: "Only the fields sent change; `null` clears a field. For a series\
        \ master `scope` defaults to ALL; THIS and FOLLOWING need `occurrence`. THIS\
        \ changes the occurrence's override (created on first change), FOLLOWING splits\
        \ the series and returns the new series, ALL changes the master (overrides\
        \ that still had the old value of a field take the new one). Addressing an\
        \ override stands for its occurrence (`scope` defaults to THIS). A single\
        \ event ignores `scope`."
      operationId: updateEvent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: Which occurrences of a series to change
        in: query
        name: scope
        required: false
        schema:
          type: string
          enum:
          - THIS
          - FOLLOWING
          - ALL
      - description: "Original start of the occurrence: an instant (timed series)\
          \ or a date (all-day series)"
        in: query
        name: occurrence
        required: false
        schema:
          type: string
      - description: ETag of the addressed event
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventPatchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: "Changed; the event holding the change (event, override or\
            \ new series) with its ETag"
          headers:
            ETag:
              description: Version of the returned event
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid or unknown fields, or a missing, malformed or mismatching\
            \ occurrence"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such event or occurrence, or the event is in the Trash"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Changed concurrently, or the calendar is read-only or not\
            \ local"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match does not match the current ETag
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: If-Match is missing
      summary: Change an event or occurrences of a series
      tags:
      - Calendars
  /api/v1/capture:
    post:
      description: "Creates a task in the INBOX (WAITING with a `^` token) from `text`,\
        \ applying the capture syntax unless `parse` is false, and links `fileIds`\
        \ to it. With a client-generated `id` (UUIDv7) the capture is idempotent:\
        \ repeating it returns the existing task (200) unchanged."
      operationId: capture
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: A task with this id already exists; it is returned unchanged
          headers:
            ETag:
              description: "Version of the task, for If-Match"
              schema:
                type: string
              style: simple
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: Created
