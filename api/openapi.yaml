        color:
          type: string
          description: CSS hex color `#rrggbb`
          example: "#3366ff"
        isDefault:
          type: boolean
          description: Make it the calendar for new events. The first calendar becomes
            the default anyway.
        name:
          type: string
          maxLength: 200
        visible:
          type: boolean
          description: Default true
      required:
      - name
    CreateCalendarSourceRequest:
      type: object
      description: A new external calendar source. Secrets are stored encrypted and
