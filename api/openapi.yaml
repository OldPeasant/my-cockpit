      tags:
      - Mail accounts
  /api/v1/mail/accounts/{id}/folders/sync:
    post:
      description: "Adds new folders, removes vanished ones (their cached messages\
        \ stay as link targets) and detects roles via SPECIAL-USE (RFC 6154) or well-known\
        \ names. Roles set by hand are kept."
      operationId: syncMailFolders
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
