# End-to-end test stack (Playwright against a running server, see p0-e2e-harness).
# The datasource comes from SPRING_DATASOURCE_* of the e2e environment; logs stay JSON.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cockpit_e2e}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cockpit}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cockpit}

# Bookmarks: the e2e stack has no internet; the phase 6 demo bookmarks the server's own page (web/e2e/phase6).
cockpit.bookmarks.fetch.allow-private-networks=true
