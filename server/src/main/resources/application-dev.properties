# Local development: `./gradlew bootRun --args='--spring.profiles.active=dev'` against a local Postgres
# (defaults below, overridable through SPRING_DATASOURCE_*).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cockpit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cockpit}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cockpit}

# Human-readable logs instead of JSON.
logging.structured.format.console=
logging.level.ch.sonensei.cockpit=DEBUG
