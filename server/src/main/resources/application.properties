spring.application.name=cockpit-server

# Database: set via SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (SPEC.md §11).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cockpit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cockpit}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Schema is owned by Flyway; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Migrations live in db/migration/<module>/V<yyyyMMddHHmm>__<module>_<desc>.sql (subfolders are scanned).
# Parallel tasks create timestamped versions, so a later-merged older version must still be applied.
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true

# AES-256 master key for stored credentials (base64, 32 bytes, SPEC.md §4.1). Startup fails without it.
cockpit.crypto.master-key=${COCKPIT_MASTER_KEY:}

# OAuth apps for Google and Microsoft (SPEC.md §7.1, docs/oauth-setup.md). Unset client ids disable the provider.
cockpit.oauth.public-url=https://${COCKPIT_DOMAIN:localhost}
cockpit.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
cockpit.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
cockpit.oauth.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
cockpit.oauth.google.token-uri=https://oauth2.googleapis.com/token
cockpit.oauth.google.revocation-uri=https://oauth2.googleapis.com/revoke
cockpit.oauth.microsoft.client-id=${MS_CLIENT_ID:}
cockpit.oauth.microsoft.client-secret=${MS_CLIENT_SECRET:}
cockpit.oauth.microsoft.authorization-uri=https://login.microsoftonline.com/${MS_TENANT:common}/oauth2/v2.0/authorize
cockpit.oauth.microsoft.token-uri=https://login.microsoftonline.com/${MS_TENANT:common}/oauth2/v2.0/token

# Jackson: ISO-8601 strings for dates/times, never numeric timestamps.
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.datatype.datetime.write-durations-as-timestamps=false

# OpenAPI: sorted keys so the generated contract api/openapi.yaml is deterministic.
springdoc.writer-with-order-by-keys=true
# Keep shared schemas (ProblemDetail) in the contract even before an endpoint references them.
springdoc.remove-broken-reference-definitions=false

# JSON (Logstash format) console logs; the dev profile switches back to plain text.
logging.structured.format.console=logstash
