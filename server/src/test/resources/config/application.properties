# Loaded in addition to the main application.properties for every test context.
# Fictitious master key (base64 of "cockpit-test-master-key-not-real"); real deployments set COCKPIT_MASTER_KEY.
cockpit.crypto.master-key=Y29ja3BpdC10ZXN0LW1hc3Rlci1rZXktbm90LXJlYWw=
# Many cached Spring contexts share one Postgres container (PostgresTestBase), so keep each context's pool small.
spring.datasource.hikari.maximum-pool-size=5
# Reminders fire only when a test calls ReminderService.fireDue with its own clock, never from the background scheduler.
cockpit.reminders.scheduler.enabled=false
# File blobs of tests stay inside the build directory.
cockpit.data-dir=build/test-data
